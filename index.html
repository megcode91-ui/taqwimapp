<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadbir | تدبير - منظومة التدبير الشامل للتعلم</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase v9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2540',
                        accent: '#0066FF',
                        success: '#00C853',
                        warning: '#FF6D00',
                        danger: '#D50000',
                        bg: '#F8FAFC',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        
        .dark {
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F8FAFC;
            transition: background-color 0.3s ease;
        }

        .dark body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 16px;
        }

        .glass-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.15);
        }

        .rank-1 { background: linear-gradient(135deg, #FFD700 0%, #FDB931 100%); color: #000; font-weight: 800; }
        .rank-2 { background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%); color: #000; font-weight: 700; }
        .rank-3 { background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%); color: #fff; font-weight: 700; }

        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }

        .nav-item.active {
            background-color: rgba(0, 102, 255, 0.1);
            color: #0066FF;
            border-right: 3px solid #0066FF;
        }
        .dark .nav-item.active {
            background-color: rgba(0, 102, 255, 0.2);
        }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 antialiased">

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-primary to-slate-900 p-4">
        <div class="glass w-full max-w-md p-8 text-center fade-in">
            <div class="mb-6">
                <i class="fas fa-graduation-cap text-5xl text-accent mb-4"></i>
                <h1 class="text-3xl font-bold text-primary dark:text-white">Tadbir | تدبير</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2">منظومة التدبير الشامل للتعلم</p>
                <p class="text-sm text-slate-400 mt-1">إشراف: الأستاذ محمد الغمري</p>
            </div>

            <!-- Teacher Login -->
            <div id="teacherLoginForm" class="space-y-4">
                <h3 class="text-lg font-semibold text-primary dark:text-accent">دخول الأستاذ (الإدارة)</h3>
                <input type="email" id="teacherEmail" placeholder="البريد الإلكتروني" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent" value="meg.code91@gmail.com">
                <input type="password" id="teacherPassword" placeholder="كلمة المرور" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent">
                <button onclick="loginTeacher()" class="w-full bg-accent hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300">
                    <i class="fas fa-sign-in-alt ml-2"></i> دخول
                </button>
            </div>

            <div class="my-6 flex items-center">
                <div class="flex-grow border-t border-slate-300 dark:border-slate-600"></div>
                <span class="mx-4 text-slate-400 text-sm">أو</span>
                <div class="flex-grow border-t border-slate-300 dark:border-slate-600"></div>
            </div>

            <!-- Visitor Login -->
            <div id="visitorLoginForm" class="space-y-4">
                <h3 class="text-lg font-semibold text-primary dark:text-accent">دخول ولي الأمر (زائر)</h3>
                <input type="text" id="visitorName" placeholder="الاسم الكامل" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent">
                <button onclick="loginVisitor()" class="w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-3 rounded-lg transition duration-300">
                    <i class="fas fa-eye ml-2"></i> دخول كزائر
                </button>
            </div>
            
            <div id="loginError" class="mt-4 text-danger text-sm hidden"></div>
        </div>
    </div>

    <!-- Main App Layout -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-64 glass md:h-screen md:sticky md:top-0 flex flex-col z-40">
            <div class="p-6 border-b border-slate-200 dark:border-slate-700">
                <h2 class="text-2xl font-bold text-primary dark:text-white flex items-center gap-2">
                    <i class="fas fa-layer-group text-accent"></i> تدبير
                </h2>
                <p id="userDisplay" class="text-xs text-slate-500 mt-1 truncate"></p>
            </div>
            
            <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-3" id="sidebarNav">
                <!-- Nav items injected by JS -->
            </nav>

            <div class="p-4 border-t border-slate-200 dark:border-slate-700">
                <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fas fa-moon text-slate-500"></i> <span>الوضع الليلي</span>
                </button>
                <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-danger transition mt-2">
                    <i class="fas fa-sign-out-alt"></i> <span>تسجيل الخروج</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-8 overflow-y-auto h-screen">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 id="pageTitle" class="text-2xl md:text-3xl font-bold text-primary dark:text-white">لوحة القيادة الذكية</h1>
                    <p class="text-slate-500 text-sm mt-1">نظرة شاملة على أداء القسم</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden md:block text-left">
                        <p class="text-sm font-semibold" id="currentDate"></p>
                        <p class="text-xs text-slate-500">الموسم الدراسي الحالي</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-accent/10 flex items-center justify-center text-accent">
                        <i class="fas fa-bell"></i>
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Sections -->
            <div id="contentArea" class="space-y-6 fade-in">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass bg-white dark:bg-slate-900 w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-danger">
                <i class="fas fa-times text-xl"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Firebase Configuration & Initialization
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDINWHZW3yo9a7Ch1fDFgGlePnD4dvovzs",
            authDomain: "taqwim-d363e.firebaseapp.com",
            projectId: "taqwim-d363e",
            storageBucket: "taqwim-d363e.firebasestorage.app",
            messagingSenderId: "996744665537",
            appId: "1:996744665537:web:018aee25726259f8507740",
            measurementId: "G-Q248VTXCG0"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==========================================
        // 2. State Management
        // ==========================================
        const state = {
            user: null,
            role: null, // 'teacher' or 'visitor'
            visitorName: '',
            currentView: 'dashboard',
            students: [],
            tests: [],
            attendance: [],
            darkMode: localStorage.getItem('darkMode') === 'true'
        };

        // ==========================================
        // 3. Core Logic & Helpers
        // ==========================================
        function isSummerVacation() {
            const now = new Date();
            const year = now.getFullYear();
            const start = new Date(year, 6, 1); // July 1
            const end = new Date(year, 8, 11);  // Sept 11
            return now >= start && now <= end;
        }

        function calculateStudentMetrics(student) {
            // Simplified calculation based on prompt rules
            // In a real app, this would aggregate from tests, caGrades, attendance collections
            const testAvg = student.testAvg || 0;
            const caAvg = student.caAvg || 0;
            const activities = (student.extraActivities || 0) * 0.01 + (student.distinctionActivities || 0) * 0.01;
            const deductions = (student.absences || 0) * 0.01 + (student.missedHomework || 0) * 0.01;
            
            const cumulativeAvg = ((testAvg + caAvg) / 2) + activities - deductions;
            return {
                average: Math.max(0, cumulativeAvg).toFixed(2),
                isAtRisk: cumulativeAvg < 5,
                isExcellent: cumulativeAvg >= 8
            };
        }

        function logAudit(action, details) {
            if (state.role !== 'teacher') return;
            db.collection("auditLog").add({
                action,
                details,
                user: state.user?.email || state.visitorName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // ==========================================
        // 4. Authentication
        // ==========================================
        function loginTeacher() {
            const email = document.getElementById('teacherEmail').value;
            const password = document.getElementById('teacherPassword').value;
            
            if (email !== "meg.code91@gmail.com") {
                showLoginError("البريد الإلكتروني غير مصرح به لهذا النظام.");
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    state.user = userCredential.user;
                    state.role = 'teacher';
                    initApp();
                })
                .catch((error) => {
                    showLoginError("خطأ في الدخول: " + error.message);
                });
        }

        function loginVisitor() {
            const name = document.getElementById('visitorName').value.trim();
            if (!name) {
                showLoginError("الرجاء إدخال الاسم");
                return;
            }

            if (isSummerVacation()) {
                alert("انتهى الموسم الدراسي - يمكنكم العودة في بداية الموسم المقبل");
                return;
            }

            state.visitorName = name;
            state.role = 'visitor';
            
            db.collection("visitorLogs").add({
                name: name,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            initApp();
        }

        function showLoginError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function logout() {
            auth.signOut();
            state.user = null;
            state.role = null;
            state.visitorName = '';
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }

        // ==========================================
        // 5. UI Rendering
        // ==========================================
        function initApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            if (state.darkMode) document.documentElement.classList.add('dark');
            
            document.getElementById('userDisplay').textContent = state.role === 'teacher' ? state.user.email : `زائر: ${state.visitorName}`;
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ar-MA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            renderSidebar();
            navigateTo('dashboard');
            
            // Real-time listeners
            setupRealtimeListeners();
        }

        function renderSidebar() {
            const navItems = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'لوحة القيادة الذكية', teacherOnly: false },
                { id: 'students', icon: 'fa-users', label: 'إدارة التلاميذ', teacherOnly: true },
                { id: 'assessment', icon: 'fa-calculator', label: 'محرك التقويم الذكي', teacherOnly: true },
                { id: 'attendance', icon: 'fa-clipboard-check', label: 'الحضور والسلوك', teacherOnly: true },
                { id: 'analytics', icon: 'fa-exclamation-triangle', label: 'التحليلات والإنذار المبكر', teacherOnly: false },
                { id: 'calendar', icon: 'fa-calendar-alt', label: 'التقويم التفاعلي', teacherOnly: false },
                { id: 'goals', icon: 'fa-bullseye', label: 'نظام الأهداف الذكية', teacherOnly: true },
                { id: 'announcements', icon: 'fa-bullhorn', label: 'فضاء الأولياء', teacherOnly: false },
                { id: 'motivation', icon: 'fa-trophy', label: 'نظام التحفيز', teacherOnly: false },
                { id: 'settings', icon: 'fa-cogs', label: 'مركز التحكم', teacherOnly: true }
            ];

            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = navItems.map(item => {
                if (item.teacherOnly && state.role !== 'teacher') return '';
                return `
                    <button onclick="navigateTo('${item.id}')" id="nav-${item.id}" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition mb-1">
                        <i class="fas ${item.icon} w-5 text-center"></i>
                        <span class="font-semibold text-sm">${item.label}</span>
                    </button>
                `;
            }).join('');
        }

        function navigateTo(viewId) {
            state.currentView = viewId;
            
            // Update active nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${viewId}`);
            if (activeNav) activeNav.classList.add('active');

            // Update title
            const titles = {
                dashboard: 'لوحة القيادة الذكية',
                students: 'إدارة التلاميذ',
                assessment: 'محرك التقويم الذكي',
                attendance: 'الحضور والسلوك',
                analytics: 'التحليلات والإنذار المبكر',
                calendar: 'التقويم التفاعلي',
                goals: 'نظام الأهداف الذكية',
                announcements: 'فضاء الأولياء',
                motivation: 'نظام التحفيز',
                settings: 'مركز التحكم'
            };
            document.getElementById('pageTitle').textContent = titles[viewId];

            // Render content
            const content = document.getElementById('contentArea');
            content.innerHTML = '<div class="flex justify-center p-8"><i class="fas fa-circle-notch fa-spin text-3xl text-accent"></i></div>';
            
            setTimeout(() => {
                switch(viewId) {
                    case 'dashboard': renderDashboard(content); break;
                    case 'students': renderStudents(content); break;
                    case 'assessment': renderAssessment(content); break;
                    case 'attendance': renderAttendance(content); break;
                    case 'analytics': renderAnalytics(content); break;
                    case 'calendar': renderCalendar(content); break;
                    case 'goals': renderGoals(content); break;
                    case 'announcements': renderAnnouncements(content); break;
                    case 'motivation': renderMotivation(content); break;
                    case 'settings': renderSettings(content); break;
                }
            }, 300);
        }

        // ==========================================
        // 6. View Renderers
        // ==========================================
        function renderDashboard(container) {
            const metrics = state.students.map(s => calculateStudentMetrics(s));
            const atRiskCount = metrics.filter(m => m.isAtRisk).length;
            const avgClass = metrics.length > 0 ? (metrics.reduce((sum, m) => sum + parseFloat(m.average), 0) / metrics.length).toFixed(2) : 0;

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
                    ${statCard('إجمالي التلاميذ', state.students.length, 'fa-users', 'bg-blue-100 text-blue-600')}
                    ${statCard('متوسط القسم', avgClass, 'fa-chart-line', 'bg-green-100 text-green-600')}
                    ${statCard('الاختبارات المنجزة', state.tests.length, 'fa-file-alt', 'bg-purple-100 text-purple-600')}
                    ${statCard('تلاميذ في خطر', atRiskCount, 'fa-exclamation-circle', 'bg-red-100 text-red-600')}
                    ${statCard('نسبة الحضور', '94%', 'fa-user-check', 'bg-orange-100 text-orange-600')}
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="glass p-6 lg:col-span-2">
                        <h3 class="font-bold text-lg mb-4">توزيع المعدلات</h3>
                        <canvas id="gradesChart" height="100"></canvas>
                    </div>
                    <div class="glass p-6">
                        <h3 class="font-bold text-lg mb-4">تنبيهات عاجلة</h3>
                        <div class="space-y-3">
                            ${atRiskCount > 0 ? `<div class="flex items-center gap-3 p-3 bg-red-50 dark:bg-red-900/20 border-r-4 border-danger rounded-lg"><i class="fas fa-bell text-danger"></i><div><p class="font-semibold text-sm">تلاميذ في خطر</p><p class="text-xs text-slate-500">${atRiskCount} تلميذ يحتاج تدخل فوري</p></div></div>` : ''}
                            <div class="flex items-center gap-3 p-3 bg-blue-50 dark:bg-blue-900/20 border-r-4 border-accent rounded-lg"><i class="fas fa-info-circle text-accent"></i><div><p class="font-semibold text-sm">تحديث النظام</p><p class="text-xs text-slate-500">تم تحديث بيانات المراقبة المستمرة</p></div></div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                new Chart(document.getElementById('gradesChart'), {
                    type: 'bar',
                    data: {
                        labels: ['< 5', '5 - 6', '6 - 7', '7 - 8', '> 8'],
                        datasets: [{
                            label: 'عدد التلاميذ',
                            data: [
                                metrics.filter(m => m.average < 5).length,
                                metrics.filter(m => m.average >= 5 && m.average < 6).length,
                                metrics.filter(m => m.average >= 6 && m.average < 7).length,
                                metrics.filter(m => m.average >= 7 && m.average < 8).length,
                                metrics.filter(m => m.average >= 8).length
                            ],
                            backgroundColor: ['#D50000', '#FF6D00', '#FFD600', '#00C853', '#0066FF'],
                            borderRadius: 6
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }, 100);
        }

        function statCard(title, value, icon, colorClass) {
            return `
                <div class="glass glass-card p-4 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full ${colorClass} flex items-center justify-center text-xl">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div>
                        <p class="text-slate-500 text-xs font-semibold">${title}</p>
                        <p class="text-2xl font-bold font-inter text-primary dark:text-white">${value}</p>
                    </div>
                </div>
            `;
        }

        function renderStudents(container) {
            const levelFilter = 'all'; // Can be extended to tabs
            const sortedStudents = [...state.students].sort((a, b) => calculateStudentMetrics(b).average - calculateStudentMetrics(a).average);

            container.innerHTML = `
                <div class="glass p-4 mb-4 flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div class="relative w-full md:w-96">
                        <i class="fas fa-search absolute right-3 top-3 text-slate-400"></i>
                        <input type="text" id="studentSearch" onkeyup="filterStudents()" placeholder="بحث بالاسم..." class="w-full pr-10 pl-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent">
                    </div>
                    ${state.role === 'teacher' ? `<button onclick="openAddStudentModal()" class="bg-accent text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"><i class="fas fa-plus ml-2"></i> إضافة تلميذ</button>` : ''}
                </div>

                <div class="glass overflow-x-auto">
                    <table class="w-full text-sm text-right">
                        <thead class="bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold">
                            <tr>
                                <th class="p-4 rounded-tr-lg">الرتبة</th>
                                <th class="p-4">الاسم الكامل</th>
                                <th class="p-4">المستوى</th>
                                <th class="p-4 font-inter">المعدل</th>
                                <th class="p-4">الأنشطة</th>
                                <th class="p-4">الخصومات</th>
                                <th class="p-4 rounded-tl-lg text-center">إجراءات</th>
                            </tr>

        function saveAttendance() {
            const date = document.getElementById('attendanceDate').value;
            const absences = document.querySelectorAll('input[data-type="absence"]:checked');

            const batch = db.batch();
            
            absences.forEach(cb => {
                const ref = db.collection("attendance").doc();
                batch.set(ref, {
                    studentId: cb.dataset.id,
                    date: date,
                    unexcusedAbsence: true,
                    missedHomework: false,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

            homeworks.forEach(cb => {

                    studentId: cb.dataset.id,
                    date: date,
                    unexcusedAbsence: false,
                    missedHomework: true,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            });

            batch.commit().then(() => {
                alert("تم حفظ بيانات الحضور والسلوك بنجاح");
                logAudit("تسجيل حضور وغياب", date);

        function setupRealtimeListeners() {
            // Listen to students
            db.collection("students").onSnapshot((snapshot) => {
                state.students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (state.currentView === 'students' || state.currentView === 'dashboard' || state.currentView === 'motivation' || state.currentView === 'analytics') {
                    navigateTo(state.currentView); // Re-render to show updates
                }
            });

            // Listen to tests
            db.collection("tests").onSnapshot((snapshot) => {
                state.tests = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (state.currentView === 'dashboard') navigateTo('dashboard');
            });
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', state.darkMode);
            if (state.currentView === 'settings') navigateTo('settings'); // Re-render toggle
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        function exportData() {
            const data = {
                students: state.students,
                exportDate: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
