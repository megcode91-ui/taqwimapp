<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173f2f">
<title>قسمي Qismi v1 — فضاء الأستاذ وتلاميذه وأوليائهم</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/lalezar@latest/css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-sans-arabic@latest/css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-sans-arabic@latest/arabic-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-sans-arabic@latest/arabic-700-normal.css">
<style>
:root{
  --board:#173f2f; --board2:#0f2f22; --chalk:#f4f1e4; --chalk-dim:#c9d4c4;
  --paper:#faf7ec; --card:#fffdf4; --line:#e4dcc2; --line2:#d5cba8;
  --ink:#22303a; --muted:#6d7a72;
  --red:#c8372d; --red-d:#a52b22; --blue:#2456a6; --green:#1d7a4f; --yellow:#f7c948; --yellow-soft:#fdf0c8;
  --wood:#8a5a33; --wood-d:#6d4426; --amber:#d98a16;
  --shadow:0 10px 28px rgba(23,42,32,.13);
  --offbar-h:0px;
  --f-disp:'Lalezar','IBM Plex Sans Arabic',system-ui;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-body); color:var(--ink); background-color:var(--paper);
  background-image:
    linear-gradient(rgba(60,90,120,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(60,90,120,.06) 1px, transparent 1px);
  background-size:28px 28px; min-height:100vh;
  padding-top:var(--offbar-h,0px); transition:padding-top .35s ease;
}
body::before{content:''; position:fixed; top:var(--offbar-h,0px); bottom:0; right:76px; width:2px; background:rgba(200,55,45,.22); z-index:0; pointer-events:none; transition:top .35s ease}
@media(max-width:900px){ body::before{display:none} }
::selection{background:var(--yellow); color:var(--ink)}
#doodles span{position:fixed; z-index:0; pointer-events:none; color:#3c5a4a; opacity:.06; font-family:var(--f-disp); animation:floaty ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-14px) rotate(-8deg)} to{transform:translateY(16px) rotate(9deg)}}
#app{position:relative; z-index:1}
button{font-family:inherit}
:focus-visible{outline:3px solid rgba(36,86,166,.45); outline-offset:2px; border-radius:6px}

/* ====== offline bar ====== */
.offline-bar{position:fixed; top:0; left:0; right:0; z-index:300; background:linear-gradient(90deg,#a52b22,#c8372d 50%,#a52b22); color:#fff; font-weight:800; font-size:.9rem; text-align:center; padding:11px 16px; display:flex; align-items:center; justify-content:center; gap:9px; transform:translateY(-130%); transition:transform .4s cubic-bezier(.2,.8,.3,1); box-shadow:0 5px 16px rgba(165,43,34,.45)}
.offline-bar.show{transform:none}
.offline-bar .ob-dot{width:9px; height:9px; border-radius:50%; background:#fff; animation:pulse 1s infinite; flex:none}
.offline-bar .ob-retry{background:rgba(255,255,255,.18); border:1.4px solid rgba(255,255,255,.5); color:#fff; border-radius:8px; padding:3px 12px; font-weight:800; font-size:.8rem; cursor:pointer; transition:.2s}
.offline-bar .ob-retry:hover{background:rgba(255,255,255,.3)}

/* ====== boot ====== */
.boot{position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 28%, #1c4a37, #0f2f22 72%); padding:20px; transition:opacity .55s ease, visibility .55s; overflow:auto}
.boot.hide{opacity:0; visibility:hidden; pointer-events:none}
.boot-card{padding:38px 30px; text-align:center; border:6px solid var(--wood); max-width:520px; width:100%; position:relative; z-index:2; margin:auto}
.boot-logo{font-family:var(--f-disp); font-size:3.2rem; color:var(--chalk); text-shadow:0 0 16px rgba(244,241,228,.35), 2px 3px 0 rgba(0,0,0,.25); line-height:1}
.boot-logo .ver-chip{font-size:1rem; vertical-align:middle}
.boot-spinner{width:56px; height:56px; margin:22px auto; border:5px solid rgba(244,241,228,.22); border-top-color:var(--yellow); border-radius:50%; animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-msg{color:var(--chalk); font-weight:800; font-size:1.08rem}
.boot-sub{color:var(--chalk-dim); font-size:.86rem; margin-top:9px; line-height:1.8}
.boot-err{color:#ffe2c2; font-weight:600; margin-top:16px; font-size:.85rem; line-height:1.95; background:rgba(217,138,22,.14); border:1.4px dashed rgba(255,226,194,.5); border-radius:10px; padding:13px 15px; text-align:right}
.boot-err b{color:#fff}
.boot-err .be-head{display:flex; gap:8px; align-items:center; font-weight:800; color:#fff; margin-bottom:8px; font-size:.95rem}
.boot-rules{margin-top:12px; text-align:right}
.boot-rules pre{direction:ltr; text-align:left; background:#0c241b; color:#bfe9cf; border:1.4px solid rgba(191,233,207,.25); border-radius:10px; padding:12px 13px; font-size:.74rem; line-height:1.7; overflow:auto; white-space:pre; font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace; margin-top:8px}
.boot-gd{position:absolute; font-family:var(--f-disp); color:rgba(244,241,228,.16); pointer-events:none; animation:floaty 9s ease-in-out infinite alternate}
.boot-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px}

/* ====== boards & chalk ====== */
.board{background:
  radial-gradient(ellipse at 18% 25%, rgba(255,255,255,.06), transparent 45%),
  radial-gradient(ellipse at 82% 75%, rgba(255,255,255,.05), transparent 40%),
  linear-gradient(160deg,#1c4a37,var(--board) 55%,var(--board2));
  color:var(--chalk); border-radius:14px; position:relative; overflow:hidden}
.board::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.6px); background-size:9px 9px; opacity:.5}
.wood-strip{height:9px; background:linear-gradient(180deg,#b07a42,var(--wood) 45%,var(--wood-d)); border-radius:0 0 6px 6px; box-shadow:0 3px 8px rgba(60,35,10,.25)}
.hl{background:linear-gradient(180deg, transparent 56%, rgba(247,201,72,.62) 56% 94%, transparent 94%); padding:0 .18em; border-radius:3px}

/* ====== generic ====== */
.card{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); transition:transform .25s, box-shadow .25s}
.card:hover{transform:translateY(-2px)}
.card-h{font-family:var(--f-disp); font-size:1.35rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mini{font-size:.82rem} .muted{color:var(--muted)}
.btn{display:inline-flex; align-items:center; gap:7px; border:none; cursor:pointer; font-weight:700; font-size:.95rem; padding:10px 18px; border-radius:10px; transition:.22s; text-decoration:none}
.btn:active{transform:scale(.96)}
.btn-red{background:var(--red); color:#fff; box-shadow:0 5px 14px rgba(200,55,45,.32)}
.btn-red:hover{background:var(--red-d); transform:translateY(-2px)}
.btn-board{background:var(--board); color:var(--chalk); box-shadow:0 5px 14px rgba(23,63,47,.3)}
.btn-board:hover{background:var(--board2); transform:translateY(-2px)}
.btn-ghost{background:transparent; color:var(--ink); border:1.6px solid var(--line2)}
.btn-ghost:hover{border-color:var(--ink); background:#fff}
.btn-sm{padding:6px 12px; font-size:.83rem; border-radius:8px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 11px; border-radius:999px; font-size:.8rem; font-weight:700; border:1.5px solid transparent}
.chip.good{background:#e2f2e6; color:var(--green); border-color:#bfe0c8}
.chip.bad{background:#fbe4e1; color:var(--red); border-color:#f0c2bc}
.chip.ok{background:#e4ecf8; color:var(--blue); border-color:#c3d5ee}
.chip.neutral{background:#efeadd; color:#6b6248; border-color:var(--line2)}
.chip.gold{background:var(--yellow-soft); color:#8a6a10; border-color:#ecd382}
.input, select.input, textarea.input{width:100%; padding:10px 13px; border:1.6px solid var(--line2); border-radius:10px; background:#fff; font-family:inherit; font-size:.95rem; color:var(--ink); transition:.2s}
.input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(36,86,166,.15); outline:none}
.input.err{border-color:var(--red); box-shadow:0 0 0 3px rgba(200,55,45,.15)}
.f-label{display:block; font-weight:700; font-size:.85rem; margin:10px 0 5px; color:#4c5a52}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:820px){ .grid2{grid-template-columns:1fr} }
.reveal{opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease}
.reveal.in{opacity:1; transform:none}
.empty{padding:26px 14px; text-align:center; color:var(--muted); border:1.6px dashed var(--line2); border-radius:12px; background:#fffef9}
.empty b{display:block; font-size:2rem; margin-bottom:6px; filter:grayscale(.2)}

/* ====== gate ====== */
.gate{max-width:1060px; margin:0 auto; padding:22px 18px 40px}
.gate-board{padding:26px 26px 22px; border:6px solid var(--wood); box-shadow:var(--shadow), inset 0 0 40px rgba(0,0,0,.25)}
.gate-top{display:flex; align-items:center; gap:22px; flex-wrap:wrap; position:relative; z-index:2}
.gate-title{flex:1; min-width:240px}
.qismi-title{font-family:var(--f-disp); font-size:clamp(3.2rem,8vw,5rem); line-height:1; color:var(--chalk); text-shadow:0 0 14px rgba(244,241,228,.35), 2px 3px 0 rgba(0,0,0,.25); letter-spacing:.02em}
.ver-chip{font-family:var(--f-disp); background:var(--yellow); color:#5c4708; padding:2px 12px; border-radius:8px; font-size:1.1rem; vertical-align:middle; display:inline-block; transform:rotate(-4deg); box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.gate-tag{margin-top:8px; color:var(--chalk-dim); font-size:1.02rem}
.gate-date{text-align:center; min-width:150px}
.chalk-clock{font-family:var(--f-disp); font-size:2rem; letter-spacing:.06em; direction:ltr}
.chalk-date{color:var(--chalk-dim); font-size:.9rem; margin-top:2px}
.wallclock{width:96px; height:96px; flex:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.wc-face{fill:rgba(255,255,255,.04); stroke:var(--chalk); stroke-width:3}
.wc-ticks line{stroke:var(--chalk-dim); stroke-width:2}
.wc-h,.wc-m{stroke:var(--chalk); stroke-linecap:round}
.wc-h{stroke-width:4} .wc-m{stroke-width:3}
.wc-s{stroke:var(--yellow); stroke-width:1.6; stroke-linecap:round}
.wc-c{fill:var(--yellow)}
.chalk-chips{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; position:relative; z-index:2}
.chalk-chip{border:1.6px dashed rgba(244,241,228,.55); color:var(--chalk); padding:6px 14px; border-radius:10px; font-size:.92rem; transform:rotate(-1deg); transition:.25s; background:rgba(255,255,255,.03)}
.chalk-chip:nth-child(even){transform:rotate(1.2deg)}
.chalk-chip:hover{background:rgba(255,255,255,.1); transform:rotate(0) translateY(-2px)}
.gd{position:absolute; font-family:var(--f-disp); color:rgba(244,241,228,.4); z-index:1; animation:floaty 8s ease-in-out infinite alternate; pointer-events:none}
.ann-strip{margin:18px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-right:6px solid var(--yellow)}
.ann-strip .ann-item{display:inline-flex; gap:6px; align-items:center; font-size:.92rem}
.ann-strip .ann-item b{color:var(--red)}
.doors{display:flex; gap:22px; justify-content:center; flex-wrap:wrap; margin:26px 0 10px}
.door{position:relative; width:min(330px,100%); padding:36px 24px 30px; border-radius:16px 16px 10px 10px; cursor:pointer; text-align:center; border:none; transition:transform .4s cubic-bezier(.2,.9,.3,1.2), box-shadow .3s; overflow:hidden}
.door-title{display:block; font-family:var(--f-disp); font-size:1.9rem; margin:10px 0 4px}
.door-sub{display:block; font-size:.9rem; opacity:.85}
.door-ico{font-size:2.4rem; display:block}
.door-wood{background:linear-gradient(180deg,#b07a42,#8a5a33 55%,#6d4426); color:#f9eeda; box-shadow:inset 0 0 0 7px rgba(255,255,255,.09), inset 0 0 0 12px rgba(0,0,0,.14), var(--shadow); transform-origin:right center}
.door-wood::before{content:''; position:absolute; inset:26px 20px; border:3px solid rgba(0,0,0,.18); border-radius:10px; pointer-events:none}
.knob{position:absolute; left:20px; top:50%; width:17px; height:17px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe9a8, #c9962e 60%, #7d5a12); box-shadow:0 2px 5px rgba(0,0,0,.4); transition:.3s}
.door-wood:hover{transform:perspective(950px) rotateY(7deg) translateY(-5px); box-shadow:inset 0 0 0 7px rgba(255,255,255,.12), inset 0 0 0 12px rgba(0,0,0,.14), 0 22px 34px rgba(60,35,10,.35)}
.door-wood:hover .knob{transform:rotate(25deg) scale(1.15)}
.door-notebook{background:linear-gradient(170deg,#2f63b8,#2456a6 60%,#1c4487); color:#f2f6ff; box-shadow:inset 0 0 0 5px rgba(255,255,255,.14), var(--shadow)}
.door-notebook::before{content:''; position:absolute; top:12px; bottom:12px; right:11px; width:14px; background:radial-gradient(circle at 7px 9px, var(--paper) 4px, transparent 5px) 0 0/14px 24px repeat-y; opacity:.9}
.door-notebook::after{content:''; position:absolute; left:16px; right:34px; bottom:14px; height:34px; background:repeating-linear-gradient(180deg, rgba(255,255,255,.35) 0 1.5px, transparent 1.5px 10px); pointer-events:none}
.door-notebook:hover{transform:translateY(-7px) rotate(-1.2deg); box-shadow:inset 0 0 0 5px rgba(255,255,255,.2), 0 24px 36px rgba(20,40,90,.35)}
.login-card{max-width:430px; margin:8px auto 0; border-right:6px solid var(--board); animation:pop .35s ease}
.login-card .btn{width:100%; justify-content:center; margin-top:14px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(7px)} 40%,80%{transform:translateX(-7px)}}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none}}
.gate-foot{text-align:center; color:var(--muted); font-size:.85rem; margin-top:26px}

/* ====== app bar & admin layout ====== */
.appbar{position:sticky; top:var(--offbar-h,0px); z-index:50; border-radius:0 0 12px 12px; box-shadow:0 8px 22px rgba(15,40,30,.28); transition:top .35s ease}
.appbar-in{max-width:1220px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:12px 18px; flex-wrap:wrap; position:relative; z-index:2}
.logo{font-family:var(--f-disp); font-size:1.7rem; color:var(--chalk); text-shadow:0 0 10px rgba(244,241,228,.3)}
.logo .ver{font-style:normal; font-size:.85rem; background:var(--yellow); color:#5c4708; padding:1px 8px; border-radius:6px; vertical-align:middle; display:inline-block; transform:rotate(-4deg); margin-right:4px}
.status{display:inline-flex; align-items:center; gap:7px; font-size:.83rem; color:var(--chalk-dim); border:1.4px dashed rgba(244,241,228,.4); padding:4px 12px; border-radius:999px}
.dot{width:9px; height:9px; border-radius:50%; background:#d9a521; box-shadow:0 0 6px #d9a521; flex:none}
.dot.on{background:#5ad48a; box-shadow:0 0 8px #5ad48a; animation:pulse 1.8s infinite}
.dot.off{background:#ff5a4d; box-shadow:0 0 8px #ff5a4d; animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.appbar .clock{font-family:var(--f-disp); color:var(--yellow); font-size:1.15rem; direction:ltr; letter-spacing:.05em}
.who{font-size:.85rem; color:var(--chalk-dim); direction:ltr}
.appbar .btn-ghost{color:var(--chalk); border-color:rgba(244,241,228,.45)}
.appbar .btn-ghost:hover{background:rgba(255,255,255,.1); border-color:var(--chalk)}
.spacer{flex:1}
.admin-wrap{max-width:1220px; margin:0 auto; padding:20px 18px 60px; display:flex; gap:20px; align-items:flex-start}
.side{position:sticky; top:calc(var(--offbar-h,0px) + 86px); width:235px; flex:none; padding:12px; transition:top .35s ease}
.side .side-t{font-family:var(--f-disp); color:var(--muted); font-size:1rem; padding:4px 10px 10px}
.tab{display:flex; align-items:center; gap:10px; width:100%; text-align:right; padding:11px 13px; border:none; background:transparent; border-radius:10px; font-size:.95rem; font-weight:600; color:var(--ink); cursor:pointer; transition:.2s; margin-bottom:3px; border-right:4px solid transparent}
.tab:hover{background:var(--yellow-soft)}
.tab.on{background:var(--yellow-soft); border-right-color:var(--red); font-weight:800; box-shadow:inset 0 0 0 1px #ecd382}
.tab .t-ico{font-size:1.15rem}
.main{flex:1; min-width:0; display:flex; flex-direction:column; gap:16px}
@media(max-width:920px){
  .admin-wrap{flex-direction:column}
  .side{position:static; width:100%; display:flex; overflow-x:auto; gap:6px; padding:8px}
  .side .side-t{display:none}
  .tab{flex:none; width:auto; border-right:none; border-bottom:4px solid transparent}
  .tab.on{border-bottom-color:var(--red)}
}
.lv-tabs{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.lv-tab{padding:9px 22px; border-radius:999px; border:2px solid var(--line2); background:#fff; font-weight:800; font-size:.95rem; cursor:pointer; transition:.22s; color:#5c563e}
.lv-tab:hover{transform:translateY(-2px)}
.lv-tab.on{background:var(--lc,#e0a90f); border-color:transparent; color:#fff; box-shadow:0 6px 14px rgba(0,0,0,.18)}

/* ====== dash ====== */
.dash-head{padding:20px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; border:5px solid var(--wood)}
.dash-head h2{font-family:var(--f-disp); font-size:1.9rem; color:var(--chalk)}
.dash-head .d-date{color:var(--chalk-dim)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px}
.stat{padding:16px; text-align:center; border-top:5px solid var(--yellow)}
.stat:nth-child(2){border-top-color:var(--blue)} .stat:nth-child(3){border-top-color:var(--red)}
.stat:nth-child(4){border-top-color:var(--green)} .stat:nth-child(5){border-top-color:var(--wood)} .stat:nth-child(6){border-top-color:#8a6a10}
.stat-num{font-family:var(--f-disp); font-size:2.5rem; line-height:1.1; color:var(--board); direction:ltr}
.stat-l{font-size:.86rem; color:var(--muted); font-weight:700; margin-top:4px}
.stat-s{font-size:.76rem; color:var(--muted)}
.pods{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:820px){ .pods{grid-template-columns:1fr} }
.pod{display:flex; align-items:flex-end; justify-content:center; gap:12px; padding-top:14px; min-height:190px}
.pod-col{display:flex; flex-direction:column; align-items:center; gap:6px; width:31%}
.pod-medal{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-disp); font-size:1.15rem; color:#fff; box-shadow:0 4px 9px rgba(0,0,0,.22)}
.m1{background:linear-gradient(160deg,#f3c53f,#c9962e)} .m2{background:linear-gradient(160deg,#b9c3cb,#7f8b94)} .m3{background:linear-gradient(160deg,#cf8a52,#9c6136)}
.pod-name{font-size:.85rem; font-weight:800; text-align:center; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod-cum{font-family:var(--f-disp); color:var(--board); direction:ltr}
.pod-block{width:100%; height:var(--h,70px); border-radius:9px 9px 4px 4px; background:linear-gradient(180deg,#2c5a44,var(--board2)); box-shadow:inset 0 3px 0 rgba(255,255,255,.15)}
.pod-block.empty-b{background:repeating-linear-gradient(45deg,#efeadd 0 8px,#e4dcc2 8px 16px); box-shadow:none}
.cd{display:flex; gap:10px; justify-content:center; direction:ltr}
.cd-b{background:var(--board); color:var(--chalk); border-radius:10px; padding:10px 6px 7px; min-width:66px; text-align:center; box-shadow:inset 0 -4px 0 rgba(0,0,0,.3), 0 5px 12px rgba(23,63,47,.25); border:2px solid var(--wood)}
.cd-b b{display:block; font-family:var(--f-disp); font-size:1.9rem; line-height:1}
.cd-b i{font-style:normal; font-size:.7rem; color:var(--chalk-dim)}
.cd-b.sec b{animation:tickp 1s infinite}
@keyframes tickp{0%{transform:scale(1)} 12%{transform:scale(1.12); color:var(--yellow)} 30%{transform:scale(1)}}

/* ====== lists & tables ====== */
.stu-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; transition:.22s; flex-wrap:wrap}
.stu-row:hover{transform:translateX(-4px); border-color:var(--line2); box-shadow:0 8px 18px rgba(90,70,20,.1)}
.stu-name{font-weight:800; font-size:1.02rem}
.stu-grow{flex:1; min-width:170px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}

/* ---------- firebase ---------- */
async function tryInitFirebase(){
  try{
    if(!fbApp){
      const [{initializeApp}, fsMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      ]);
      fbApp = initializeApp(firebaseConfig);
      try{ const {getAnalytics} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js'); getAnalytics(fbApp); }catch{}
      db = fsMod.getFirestore(fbApp); FS = fsMod;
      try{ await FS.enableNetwork(db); }catch{}
    }
    await Promise.race([ FS.getDoc(FS.doc(db,'meta','app')), timeoutPromise(7000) ]);
    if(!remoteAttached){ attachRemote(); remoteAttached=true; }
    return true;
  }catch(e){ bootLastError=e; console.warn('[qismi] اتصال:', e); return false; }
}
async function bootApp(){
  showBoot('جارٍ الاتصال بالخادم السحابي…');
  for(let i=1;i<=4;i++){
    showBoot(`جارٍ الاتصال بالخادم السحابي… (المحاولة ${i}/4)`, 'نربط قسمك بالسحابة ليصل كل جديدٍ إلى تلاميذك وأوليائهم أولاً بأول.');
    if(await tryInitFirebase()){ hideBoot(); setConn('online'); toast('☁️ تم الاتصال بالخادم — كل جديد يصل فوراً للجميع'); return; }
    await sleep(1700);
  }
  setConn('offline'); showBootError();
}
async function pingServer(){
  if(!FS||!db) return false;
  try{ await Promise.race([ FS.getDoc(FS.doc(db,'meta','app')), timeoutPromise(4000) ]); return true; }
  catch(e){ bootLastError=e; return false; }
}
async function checkConnection(){
  if($('bootScreen') && !$('bootScreen').classList.contains('hide')) return;
  if(!navigator.onLine){ setConn('offline'); return; }
  const ok = await pingServer();
  setConn(ok?'online':'offline');
  if(ok) flushQueue();
}
function attachRemote(){
  COLS.forEach(c=>{
    firstSnap[c]=true;
    FS.onSnapshot(FS.collection(db,c), snap=>{
      const arr=[]; snap.forEach(d=>arr.push({id:d.id, ...d.data()}));
      if(firstSnap[c]){
        firstSnap[c]=false;
        if(arr.length===0){
          let local=[]; try{ local=JSON.parse(localStorage.getItem('qismi_'+c)||'[]'); }catch{}
          if(local.length){ local.forEach(o=>{ FS.setDoc(FS.doc(db,c,o.id),o).catch(()=>{}); }); state[c]=local; saveLocalCol(c); scheduleRender(); toast('☁️ رُفعت بياناتك المحلية السابقة إلى الخادم'); return; }
        }
      }
      state[c]=arr; saveLocalCol(c);
      if(!autoChecked){ autoChecked=true; checkAutoRefresh(); }
      scheduleRender();
    }, err=>{ console.warn('[qismi] snapshot '+c, err); setConn('offline'); });
  });
  FS.onSnapshot(FS.doc(db,'meta','app'), snap=>{
    if(!metaFirstDone){
      metaFirstDone=true;
      if(!snap.exists()){
        const lm=localStorage.getItem('qismi_meta');
        if(lm && lm!=='null'){ try{ const localMeta={...defaultMeta(), ...JSON.parse(lm), assignments:{...defaultMeta().assignments, ...(JSON.parse(lm).assignments||{})}}; FS.setDoc(FS.doc(db,'meta','app'),localMeta).catch(()=>{}); state.meta=localMeta; saveLocalMeta(); scheduleRender(); return; }catch{} }
      }
    }
    if(snap.exists()){
      const d=snap.data();
      state.meta={...defaultMeta(), ...d, assignments:{...defaultMeta().assignments, ...(d.assignments||{})}, prevRanks:{...(d.prevRanks||{})}};
      saveLocalMeta();
      if(!autoChecked){ autoChecked=true; checkAutoRefresh(); }
      scheduleRender();
    } else if(!autoChecked){ autoChecked=true; checkAutoRefresh(); }
  }, err=>{ console.warn('[qismi] snapshot meta', err); setConn('offline'); });
}

/* ---------- remote write + queue ---------- */
async function remoteWrite(fn){
  if(conn!=='online'){ writeQueue.push(fn); toast('⏳ لا يوجد اتصال الآن — ستُنفَّذ العملية عند عودة الاتصال','warn'); return; }
  try{ window.__qsup=Date.now()+1500; await fn(); }
  catch(e){ console.warn('[qismi] write failed', e); writeQueue.push(fn); setConn('offline'); toast('⏳ تعذّر الحفظ على الخادم — ستُعاد المحاولة تلقائياً','warn'); }
}
async function flushQueue(){
  if(!writeQueue.length || conn!=='online') return;
  const q=writeQueue.splice(0);
  for(const fn of q){ try{ window.__qsup=Date.now()+1500; await fn(); }catch{ writeQueue.push(fn); } }
  if(writeQueue.length) toast('⚠️ بعض العمليات لم تُزامَن بعد — ستُعاد المحاولة','warn');
  else toast('✔ تمت مزامنة كل العمليات المؤجلة بالخادم');
}
async function upsert(col,obj){
  const i=state[col].findIndex(x=>x.id===obj.id);
  if(i>=0) state[col][i]=obj; else state[col].push(obj);
  saveLocalCol(col); scheduleRender();
  await remoteWrite(()=>FS.setDoc(FS.doc(db,col,obj.id),obj));
}
async function removeDoc(col,id){
  state[col]=state[col].filter(x=>x.id!==id);
  saveLocalCol(col); scheduleRender();
  await remoteWrite(()=>FS.deleteDoc(FS.doc(db,col,id)));
}
async function saveMeta(){
  saveLocalMeta(); scheduleRender();
  await remoteWrite(()=>FS.setDoc(FS.doc(db,'meta','app'),state.meta));
}

/* ---------- computations ---------- */
function gradesVals(tests, sid){ const v=[]; tests.forEach(t=>{ const g=t.grades?.[sid]; if(typeof g==='number' && !isNaN(g)) v.push(g); }); return v; }
const avgArr = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const weeklyBaseOf = sid => avgArr(gradesVals(state.weeklyTests, sid));
const ccBaseOf = sid => avgArr(gradesVals(state.ccTests, sid));
const subjWeeklyOf = (sid,sj) => avgArr(gradesVals(state.weeklyTests.filter(t=>t.subject===sj), sid));
const subjCcOf = (sid,sj) => avgArr(gradesVals(state.ccTests.filter(t=>t.subject===sj), sid));
function weeklyModsOf(sid){
  let sum=0; const items=[];
  state.events.forEach(e=>{
    if(e.studentId!==sid) return;
    const c=EVENT_TYPES[e.type]; if(!c||!c.weekly) return;
    if(e.type==='absence' && e.restored) return;
    sum+=c.weekly; items.push({e, val:c.weekly});
  });
  return {sum, items};
}
function cumModsOf(sid){
  let sum=0; const items=[];
  state.events.forEach(e=>{
    if(e.studentId!==sid) return;
    const c=EVENT_TYPES[e.type]; if(!c) return;
    const v = e.type==='rankDrop' ? -(e.cumPenalty||0) : (c.cum||0);
    if(!v) return;
    sum+=v; items.push({e, val:v});
  });
  return {sum, items};
}
function weeklyAvgOf(sid){
  const b=weeklyBaseOf(sid), m=weeklyModsOf(sid);
  if(b==null && !m.items.length) return null;
  return (b??0)+m.sum;
}
function ccAvgOf(sid){ return ccBaseOf(sid); }
function cumulativeOf(sid){
  const w=weeklyAvgOf(sid), c=ccAvgOf(sid);
  const parts=[w,c].filter(x=>x!=null);
  if(!parts.length) return null;
  return parts.reduce((a,b)=>a+b,0)/parts.length + cumModsOf(sid).sum;
}
function rankListOf(lv){
  const rows=state.students.filter(s=>s.level===lv)
    .map(s=>({sid:s.id, cum:cumulativeOf(s.id)})).filter(x=>x.cum!=null);
  rows.sort((a,b)=>b.cum-a.cum);
  let last=null, rank=0; const out=[];
  rows.forEach((x,i)=>{ const v=Math.round(x.cum*100)/100; if(last===null||v!==last){ rank=i+1; last=v; } out.push({sid:x.sid, rank, cum:v}); });
  return out;
}
function rankInfo(sid){
  const st=studentOf(sid); if(!st) return null;
  const list=rankListOf(st.level);
  const e=list.find(x=>x.sid===sid);
  return { entry:e||null, total:list.length };
}
function computeAssignments(lv, ranked){
  const byRank={}; ranked.forEach(r=>byRank[r.rank]=r.sid);
  const boys=ranked.filter(r=>genderOf(r.sid)==='ذكر');
  const girls=ranked.filter(r=>genderOf(r.sid)==='أنثى');
  const tasks={};
  const add=(sid,t)=>{ if(!sid) return; (tasks[sid]=tasks[sid]||new Set()).add(t); };
  add(byRank[1],'رئيس القسم');
  if(boys[0]) add(boys[0].sid,'رئيس شرطة القسم');
  boys.slice(1,5).forEach(b=>add(b.sid,'شرطة القسم'));
  [2,3].forEach(r=>add(byRank[r],'مراقبة الانضباط'));
  [4,5].forEach(r=>add(byRank[r],'توزيع وجمع الدفاتر'));
  [1,2,3].forEach(r=>add(byRank[r],'مهمة التأطير الخاص'));
  if(girls[0]) add(girls[0].sid,'الخدمات الخارجية');
  if(boys[0]) add(boys[0].sid,'الخدمات الخارجية');
  return Object.entries(tasks).map(([sid,list])=>({sid, tasks:[...list]}));
}
function tasksOf(sid){
  const st=studentOf(sid); if(!st) return [];
  return (state.meta.assignments?.[st.level]||[]).find(a=>a.sid===sid)?.tasks || [];
}
const upcomingOf = lv => state.weeklyTests.filter(t=>t.level===lv && t.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date));
const annAuto = ()=> state.weeklyTests.filter(t=>t.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date))
  .map(t=>({icon:subjOf(t.subject).icon, txt:`اختبار ${subjOf(t.subject).name} — ${levelName(t.level)}`, date:t.date, inDays:daysUntil(t.date)}));
function scheduledTimes(){
  const now=new Date();
  const targetFor=(y,m)=>{ const dim=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(30,dim),20,0,0); };
  let next=targetFor(now.getFullYear(), now.getMonth());
  if(now>=next){ let m=now.getMonth()+1, y=now.getFullYear(); if(m>11){m=0;y++;} next=targetFor(y,m); }
  let last=targetFor(now.getFullYear(), now.getMonth());
  if(now<last){ let m=now.getMonth()-1, y=now.getFullYear(); if(m<0){m=11;y--;} last=targetFor(y,m); }
  return {last, next};
}
function checkAutoRefresh(){
  const {last}=scheduledTimes();
  if(!state.meta.lastRefresh || new Date(state.meta.lastRefresh).getTime() < last.getTime()) runMonthlyRefresh(false);
}
function runMonthlyRefresh(manual){
  const newPrev={}; const newEvents=[];
  LEVELS.forEach(L=>{
    const ranked=rankListOf(L.id);
    const newRanks={}; ranked.forEach(r=>newRanks[r.sid]=r.rank);
    const old=state.meta.prevRanks?.[L.id]||{};
    if(state.meta.lastRefresh){
      ranked.forEach(r=>{
        const o=old[r.sid];
        if(o!=null){
          const drop=r.rank-o;
          if(drop>=1){
            const pen=drop===1?0.1:drop===2?0.2:drop===3?0.3:0.5;
            const word=drop===1?'رتبة واحدة':drop===2?'رتبتين':drop===3?'ثلاث رتب':'أكثر من ثلاث رتب';
            newEvents.push({id:uid(), studentId:r.sid, type:'rankDrop', date:todayISO(), note:`التراجع ب${word} في الترتيب الشهري (${levelName(L.id)})`, cumPenalty:pen, restored:false});
          }
        }
      });
    }
    newPrev[L.id]=newRanks;
    state.meta.assignments[L.id]=computeAssignments(L.id, ranked);
  });
  newEvents.forEach(e=>upsert('events',e));
  const now=new Date();
  state.meta.prevRanks=newPrev;
  state.meta.lastRefresh=now.toISOString();
  state.meta.period=MONTHS_MA[now.getMonth()]+' '+now.getFullYear();
  saveMeta();
  toast(manual?'🗓️ تم تجديد المهام الشهرية ✔':'🗓️ تم التجديد الشهري التلقائي للمهام');
}

function tabDash(){
  const st=state.students;
  const allCum=st.map(s=>cumulativeOf(s.id)).filter(x=>x!=null);
  const classAvg=allCum.length?allCum.reduce((a,b)=>a+b,0)/allCum.length:null;
  const futureN=state.weeklyTests.filter(t=>t.date>=todayISO()).length;
  const tasksN=(state.meta.assignments['5']?.length||0)+(state.meta.assignments['6']?.length||0);
  const stat=(n,l,s,dec)=>`<div class="card stat reveal"><div class="stat-num" data-to="${n}" ${dec?`data-dec="${dec}"`:''}>0</div><div class="stat-l">${l}</div>${s?`<div class="stat-s">${s}</div>`:''}</div>`;
  const podiumCard=lv=>{
    const L=LEVELS.find(x=>x.id===lv);
    const top=rankListOf(lv).slice(0,3);
    const slots=[{r:2,h:66},{r:1,h:98},{r:3,h:52}];
    return `<div class="card reveal"><h3 class="card-h">🏆 podium — ${L.name}</h3>
      <div class="pod">${slots.map(sl=>{
        const e=top.find(x=>x.rank===sl.r);
        return e?`<div class="pod-col"><span class="pod-medal m${sl.r}">${sl.r}</span><b class="pod-name">${esc(nameOf(e.sid))}</b><span class="pod-cum">${f2(e.cum)}</span><i class="pod-block" style="--h:${sl.h}px"></i></div>`
               :`<div class="pod-col"><i class="pod-block empty-b" style="--h:${sl.h}px"></i></div>`;
      }).join('')}</div></div>`;
  };
  const anns=[...annAuto().slice(0,4), ...state.announcements.slice(0,2).map(a=>({icon:'📌', txt:a.text, date:a.date, inDays:daysUntil(a.date)}))];
  return `
  <div class="board dash-head reveal in">
    <div><h2>🖥️ مكتب الأستاذ(ة)</h2><span class="d-date">${todayLine()} · <span dir="ltr">${esc(adminEmail())}</span></span></div>
    <span class="spacer"></span>
    <span class="status"><i class="dot"></i><span data-conn-text data-conn-online="متصل بالخادم — مزامنة مباشرة وفورية" data-conn-offline="انقطع الاتصال — جارٍ إعادة المحاولة" data-conn-boot="جارٍ الاتصال…"></span></span>
  </div>
  <div class="stats">
    ${stat(st.length,'تلاميذ القسم',`5اب: ${st.filter(s=>s.level==='5').length} · 6اب: ${st.filter(s=>s.level==='6').length}`)}
    ${stat(st.filter(s=>s.gender==='ذكر').length+' / '+st.filter(s=>s.gender==='أنثى').length,'ذكور / إناث','توزيع الجنس')}
    ${stat(state.weeklyTests.length,'اختبارات أسبوعية',`${futureN} مبرمجة مستقبليا`)}
    ${stat(state.ccTests.length,'مراقبات مستمرة','حسب المواد الثلاث')}
    ${stat(classAvg==null?0:classAvg,'معدل القسم العام',null,2)}
    ${stat(tasksN,'مهام موزعة','التجديد: 30 من كل شهر 20:00')}
  </div>
  <div class="pods">${podiumCard('5')}${podiumCard('6')}</div>
  <div class="grid2">
    <div class="card reveal">
      <h3 class="card-h">🗓️ التجديد الشهري للمهام</h3>
      ${cdHTML()}
      <div style="text-align:center; margin-top:12px"><button class="btn btn-board btn-sm" onclick="Q.toAdmin('tasks')">فتح ركن المهام ➜</button></div>
    </div>
    <div class="card reveal">
      <h3 class="card-h">📢 إعلان هام</h3>
      ${anns.length?anns.map(a=>`<div class="ann-row"><span>${a.icon}</span><span class="a-txt"><b>${esc(a.txt)}</b><div class="mini muted">${fmtDate(a.date)}${a.inDays>=0?` — بعد ${a.inDays===0?'اليوم':a.inDays+' يوم'}`:''}</div></span></div>`).join(''):empty('🔕','لا إعلانات حاليا.')}
    </div>
  </div>
  <div class="card reveal">
    <h3 class="card-h">⚖️ قوانين التحفيز والعقوبات (تُطبق تلقائيا)</h3>
    <div class="legend">
      ✚ نشاط إضافي <b>+0.1</b> معدل أسبوعي · ⭐ نشاط تميزي <b>+0.1</b> أسبوعي و <b>+0.01</b> تراكمي دفعة واحدة ·
      🕒 تغيب غير مبرر <b>−0.3</b> أسبوعي (يُسترجع بالتبرير خلال 3 أيام) · 📓 عدم إنجاز الوجبات <b>−0.05</b> أسبوعي ·
      🚷 غش <b>−0.5</b> أسبوعي (سري) · 🌪️ شغب جسيم <b>−0.5</b> أسبوعي و <b>−0.1</b> تراكمي (سري) ·
      📉 تراجع برتبة <b>−0.1</b> / برتبتين <b>−0.2</b> / بثلاث <b>−0.3</b> / بأكثر <b>−0.5</b> من المعدل التراكمي، تلقائيا عند التجديد الشهري.

}

function tabTests(kind){
  const isW=kind==='weekly';
  const tests=state[COLK[kind]].filter(t=>t.level===app.lv).sort((a,b)=>b.date.localeCompare(a.date));
  const studs=state.students.filter(s=>s.level===app.lv);
  const summaryRows = isW
    ? studs.map(s=>({s, base:weeklyBaseOf(s.id), mod:weeklyModsOf(s.id).sum, fin:weeklyAvgOf(s.id)})).filter(r=>r.base!=null||r.mod!==0)
    : studs.map(s=>({s, fin:ccAvgOf(s.id)})).filter(r=>r.fin!=null);
  return `
  <div class="card reveal in">
    <h3 class="card-h">${isW?'📝 إضافة اختبار أسبوعي':'📗 إضافة مراقبة مستمرة'} <span class="chip gold">${levelName(app.lv)}</span></h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
      <div style="flex:1; min-width:160px"><label class="f-label">المادة</label>
        <select id="tSubj" class="input">${SUBJECTS.map(s=>`<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}</select></div>
      <div style="flex:1; min-width:150px"><label class="f-label">التاريخ</label><input id="tDate" type="date" class="input" value="${todayISO()}"></div>
      <div style="flex:2; min-width:180px"><label class="f-label">العنوان (اختياري)</label><input id="tTitle" class="input" placeholder="${isW?'مثال: الاختبار الأسبوعي 1':'مثال: مراقبة الدرس 4'}"></div>
      <button class="btn btn-red" onclick="Q.addTest('${kind}')">برمجة ✔</button>
    </div>
    ${isW?`<p class="mini muted" style="margin-top:9px">📢 كل اختبار مبرمج مستقبليا يظهر تلقائيا في ركن «إعلان هام».</p>`:''}
  </div>
  ${levelTabs()}
  <div class="card reveal">
    <h3 class="card-h">${isW?'📝 الاختبارات الأسبوعية':'📗 المراقبة المستمرة'} — ${levelName(app.lv)} <span class="chip neutral">${tests.length}</span></h3>
    <div style="display:flex; flex-direction:column; gap:10px">
      ${tests.length?tests.map(t=>{
        const sj=subjOf(t.subject);
        const vals=Object.values(t.grades||{}).filter(v=>typeof v==='number');
        const tAvg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
        const du=daysUntil(t.date);
        const stChip=du>0?`<span class="chip gold">⏳ مبرمج — بعد ${du} يوم</span>`:(du===0?`<span class="chip bad">🔔 اليوم!</span>`:`<span class="chip neutral">✔ أُجري</span>`);
        return `<div class="test-card">
          <span class="subj-tag" style="--sc:${sj.color}">${sj.icon} ${sj.name}</span>
          <span class="grow"><b>${esc(t.title)}</b><div class="mini muted">📅 ${fmtDate(t.date)} ${stChip}</div></span>
          <span class="count-b" title="التلاميذ المُنقّطون / مجموع التلاميذ">✍️ ${vals.length}/${studs.length}</span>
          <span class="count-b" title="معدل الاختبار">μ ${f2(tAvg)}</span>
          <button class="btn btn-board btn-sm" onclick="Q.openGrades('${kind}','${t.id}')">✍️ مسك النقط</button>
          <button class="btn btn-ghost btn-sm" onclick="Q.askConfirm('حذف هذا الاختبار وجميع نقطه؟','Q.delTest(&quot;${kind}&quot;,&quot;${t.id}&quot;)')">🗑</button>
        </div>`;
      }).join(''):empty(isW?'📝':'','لا اختبارات مبرمجة في هذا المستوى بعد.')}
    </div>
  </div>
  ${summaryRows.length?`<div class="card reveal">
    <h3 class="card-h">${isW?'📊 المعدلات الأسبوعية للتلاميذ':'📊 معدلات المراقبة المستمرة'}</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>التلميذ(ة)</th>${isW?'<th>معدل الاختبارات</th><th>التعديلات</th>':''}<th>${isW?'المعدل الأسبوعي':'معدل المراقبة'}</th></tr></thead>
    <tbody>${summaryRows.sort((a,b)=>(b.fin??-9)-(a.fin??-9)).map(r=>`<tr><td><b>${esc(r.s.name)}</b></td>${isW?`<td>${f2(r.base)}</td><td>${r.mod?`<b class="${r.mod>0?'pos':'neg'}" dir="ltr">${signed(r.mod)}</b>`:'—'}</td>`:''}<td><b class="avg-badge ${avgCls(r.fin)}" style="font-size:1.05rem; min-width:60px">${f2(r.fin)}</b></td></tr>`).join('')}</tbody></table></div>
  </div>`:''}`;
}

      <span class="who">👨‍🏫 ${esc(adminEmail())}</span>
      <button class="btn btn-ghost btn-sm" onclick="Q.toGate()">🏠 الاستقبال</button>
      <button class="btn btn-ghost btn-sm" onclick="Q.logout()">خروج ⎋</button>
    </div>
    <div class="wood-strip"></div>
  </header>
  <div class="admin-wrap">
    <aside class="side card">
      <div class="side-t">أركان القسم</div>
      ${TABS.map(([id,ic,l])=>`<button class="tab ${app.tab===id?'on':''}" onclick="Q.toAdmin('${id}')"><span class="t-ico">${ic}</span>${l}</button>`).join('')}
    </aside>
    <main class="main">${content}</main>
  </div>`;
}

function viewStudent(){
  const s=studentOf(app.sid);
  if(!s){ app.view='gate'; return viewGate(); }
  const isAdmin=app.mode==='admin';
  const ri=rankInfo(s.id); const cum=cumulativeOf(s.id);
  const w=weeklyAvgOf(s.id), c=ccAvgOf(s.id);
  const wm=weeklyModsOf(s.id), cm=cumModsOf(s.id);
  const wBase=weeklyBaseOf(s.id);
  const tasks=tasksOf(s.id);
  const ups=upcomingOf(s.level).slice(0,5);
  const backBtn = isAdmin
    ? `<button class="btn btn-ghost btn-sm" onclick="Q.toAdmin('students')">⟵ ركن التلاميذ</button>`
    : `<button class="btn btn-ghost btn-sm" onclick="Q.toVisitorPick('${app.vlv||s.level}')">⟵ لائحة التلاميذ</button>`;
  return `<div class="gate">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap">
    ${backBtn}
    ${isAdmin?`<button class="btn btn-ghost btn-sm" onclick="Q.askConfirm('حذف التلميذ(ة) وجميع نقطه وأحداثه؟','Q.delStudent(&quot;${s.id}&quot;)')">🗑 حذف التلميذ(ة)</button>`:''}
  </div>
  <div class="board sp-head reveal in">
    <div>
      <div class="sp-name">${esc(s.name)}</div>
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap">
        <span class="chip ${s.gender==='ذكر'?'ok':'good'}">${s.gender==='ذكر'?'👦':'👧'} ${s.gender}</span>
        <span class="chip gold">🎒 ${levelName(s.level)}</span>
        <span class="rank-badge ${ri.entry?rankCls(ri.entry.rank):''}" style="border:none">الرتبة ${ri.entry?ri.entry.rank:'—'} / ${ri.total||0}</span>
      </div>
    </div>
    <div class="sp-cum"><b>${f2(cum)}</b><span>المعدل التراكمي الإجمالي</span></div>
  </div>
  <div class="wood-strip"></div>
  ${!isAdmin?`<div class="banner" style="margin-top:14px">👁️ وضع اطلاع للتلاميذ والأولياء — بعض السجلات الخاصة تبقى حكرا على الأستاذ(ة).</div>`:''}
  <div class="grid2" style="margin-top:16px">
    <div class="card reveal">
      <h3 class="card-h">📝 المعدل الأسبوعي <b class="avg-badge ${avgCls(w)}" style="margin-inline-start:auto">${f2(w)}</b></h3>
      <div class="sb"><span class="sb-l">معدل الاختبارات</span><span class="sb-bar"><i style="width:${wBase==null?0:Math.max(3,wBase*10)}%; background:var(--board)"></i></span><b class="sb-v">${f2(wBase)}</b></div>
      ${modList(wm.items)}
      <hr style="border:none; border-top:1.5px dashed var(--line); margin:10px 0">
      ${subjBars(s.id,'weekly')}
    </div>
    <div class="card reveal">
      <h3 class="card-h">📗 معدل المراقبة المستمرة <b class="avg-badge ${avgCls(c)}" style="margin-inline-start:auto">${f2(c)}</b></h3>
      ${subjBars(s.id,'cc')}
      <p class="mini muted" style="margin-top:8px">المعدل التراكمي = (الأسبوعي + المراقبة) ÷ 2 ${cm.items.length?'± تعديلات التراكم':''}.</p>
      ${cm.items.length?modList(cm.items):''}
    </div>
    <div class="card reveal">
      <h3 class="card-h">🗓️ مهامي الشهرية ${state.meta.period?`<span class="chip gold">${esc(state.meta.period)}</span>`:''}</h3>
      ${tasks.length?tasks.map(t=>{const [ ,ic]=TASK_ORDER.find(([n])=>n===t)||['','🎖️']; return `<span class="task-pill">${ic} ${t}</span>`;}).join(''):empty('🧩','لا مهام مسندة هذا الشهر.')}
    </div>
    <div class="card reveal">
      <h3 class="card-h">⏳ اختبارات قادمة — ${levelName(s.level)}</h3>
      ${ups.length?ups.map(t=>{const sj=subjOf(t.subject); const du=daysUntil(t.date); return `<div class="up-row"><span class="subj-tag" style="--sc:${sj.color}">${sj.icon} ${sj.name}</span><span style="flex:1">${esc(t.title)}</span><span class="up-in">${du===0?'اليوم':'بعد '+du+' يوم'}</span></div>`;}).join(''):empty('🔕','لا اختبارات مبرمجة مستقبليا.')}
    </div>
  </div>
  <div class="card reveal" style="margin-top:14px">
    <h3 class="card-h">⚖️ ${isAdmin?'التحفيز والعقوبات — تسجيل حدث':'سجل التلميذ(ة)'}</h3>
    ${isAdmin?`
    <div class="ev-form">
      <select id="evType" class="input" style="max-width:270px">${Object.entries(EVENT_TYPES).filter(([k])=>k!=='rankDrop').map(([k,c])=>`<option value="${k}">${c.icon} ${c.label}</option>`).join('')}</select>
      <input id="evNote" class="input" placeholder="ملاحظة (اختياري)">
      <button class="btn btn-red" onclick="Q.addEvent('${s.id}')">تسجيل ✔</button>
    </div>
    <p class="mini muted" style="margin-bottom:12px">تُطبَّق الآثار على المعدلات تلقائيا فور التسجيل · 🚷🌪️📉 أحداث سرية لا تظهر للزوار · التبرير متاح خلال 3 أيام.</p>`:''}
    ${eventRows(s.id, isAdmin)}
  </div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const root=$('app');
  if(app.view==='gate') root.innerHTML=viewGate();
  else if(app.view==='vpick') root.innerHTML=viewVisitorPick();
  else if(app.view==='admin') root.innerHTML=viewAdmin();
  else if(app.view==='student') root.innerHTML=viewStudent();
  afterRender();
}
const io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }),{threshold:.07});
function afterRender(){
  /* إظهارٌ فوريٌّ متزامن لكل بطاقةٍ موجودةٍ في الشاشة الآن (لا ينتظر المراقب — يصلح WebToApp/WebView) */
  const vh=window.innerHeight||document.documentElement.clientHeight;
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top < vh*0.95 && r.bottom > 0){ el.classList.add('in'); }
    else { try{ io.observe(el); }catch{ el.classList.add('in'); } }
  });
  /* شبكة أمانٍ مطلقة: إن تعنّت المراقب في أي بيئة، أُظهر الكل بعد مهلةٍ قصيرة */
  clearTimeout(window.__revFallback);
  window.__revFallback=setTimeout(()=>{ document.querySelectorAll('.reveal:not(.in)').forEach(el=>el.classList.add('in')); }, 700);

  document.querySelectorAll('[data-to]').forEach(el=>{
    const to=parseFloat(el.dataset.to)||0, dec=+(el.dataset.dec||0), t0=performance.now(), dur=750;
    (function step(t){ const p=Math.min(1,(t-t0)/dur); el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(dec); if(p<1) requestAnimationFrame(step); })(t0);
  });
  tickClock(); updateCountdowns(); patchConnBadges();
}
function tickClock(){
  const n=new Date();
  const s=p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds());
  document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=s);
  const H=$('wcH'), M=$('wcM'), S=$('wcS');
  if(H){ H.setAttribute('transform',`rotate(${(n.getHours()%12)*30+n.getMinutes()/2} 60 60)`);
         M.setAttribute('transform',`rotate(${n.getMinutes()*6+n.getSeconds()/10} 60 60)`);
         S.setAttribute('transform',`rotate(${n.getSeconds()*6} 60 60)`); }
}
function updateCountdowns(){
  const {next}=scheduledTimes(); nextTarget=next;
  const diff=Math.max(0, next-new Date());
  const d=Math.floor(diff/864e5), h=Math.floor(diff%864e5/36e5), m=Math.floor(diff%36e5/6e4), s=Math.floor(diff%6e4/1e3);
  document.querySelectorAll('.cd').forEach(cd=>{
    const set=(u,v)=>{ const el=cd.querySelector(`[data-u="${u}"]`); if(el) el.textContent=v; };
    set('d',d); set('h',p2(h)); set('m',p2(m)); set('s',p2(s));
  });
  document.querySelectorAll('[data-cd-label]').forEach(e=>e.textContent=`التجديد القادم: ${next.getDate()} ${MONTHS_MA[next.getMonth()]} ${next.getFullYear()} على الساعة 20:00`);
}

/* ---------- Q handlers ---------- */
const Q={};
window.Q=Q;
Q.closeModal=()=>{ $('modalRoot').innerHTML=''; };
Q.askConfirm=(msg,expr)=>{ openModal(`<div class="confirm-msg">${msg}</div><div class="modal-actions"><button class="btn btn-red" onclick="Q.closeModal();${expr}">نعم، تأكيد</button><button class="btn btn-ghost" onclick="Q.closeModal()">تراجع</button></div>`); };
Q.toggleLogin=()=>{ app.loginOpen=!app.loginOpen; render(); if(app.loginOpen) setTimeout(()=>$('adminEmail')?.focus(),60); };
Q.adminLogin=()=>{
  const el=$('adminEmail'); const v=(el.value||'').trim().toLowerCase();
  if(ADMIN_EMAILS.includes(v)){ localStorage.setItem('qismi_admin',v); app.view='admin'; app.tab='dash'; render(); window.scrollTo(0,0); toast('👋 مرحبا بك أستاذ(ة) — دُخول حصري مؤكد'); }
  else{ el.classList.add('err'); $('loginCard').classList.add('shake'); setTimeout(()=>{el.classList.remove('err'); $('loginCard')?.classList.remove('shake');},600); toast('⛔ هذا البريد غير مصرّح له بالدخول كأستاذ','warn'); }
};
Q.logout=()=>{ localStorage.removeItem('qismi_admin'); app.view='gate'; app.loginOpen=false; render(); toast('تم تسجيل الخروج — إلى اللقاء 👋'); };
Q.toGate=()=>{ app.view='gate'; render(); window.scrollTo(0,0); };
Q.toVisitorPick=(lv)=>{ app.view='vpick'; app.vlv=lv||null; render(); window.scrollTo(0,0); };
Q.openStudent=(sid,mode)=>{ app.sid=sid; app.mode=mode; if(mode==='visitor' && !app.vlv) app.vlv=studentOf(sid)?.level; app.view='student'; render(); window.scrollTo(0,0); };
Q.toAdmin=tab=>{ app.view='admin'; app.tab=tab; render(); window.scrollTo(0,0); };
Q.setLv=lv=>{ app.lv=lv; render(); };
Q.filterStudents=q=>{ q=(q||'').trim(); document.querySelectorAll('.stu-row[data-q]').forEach(r=>{ r.style.display = (!q || r.dataset.q.includes(q)) ? '' : 'none'; }); };
Q.retryBoot=()=>bootApp();
Q.forceReconnect=async()=>{ toast('🔄 جارٍ فحص الاتصال…'); const ok=await pingServer(); if(ok){ setConn('online'); flushQueue(); toast('☁️ عاد الاتصال بالخادم'); } else { toast('⚠️ لا يزال الاتصال متعذّراً — سنعيد المحاولة','warn'); } };
Q.copyRules=async()=>{
  try{ await navigator.clipboard.writeText(FIRESTORE_RULES); toast('📋 نُسخت قواعد Firestore — الصقها في Rules ثم Publish'); }
  catch{ const ta=document.createElement('textarea'); ta.value=FIRESTORE_RULES; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('📋 نُسخت القواعد'); }catch{ toast('⚠️ تعذّر النسخ التلقائي — انسخها يدوياً','warn'); } ta.remove(); }
};

Q.addStudent=()=>{
  const name=($('sName').value||'').trim();
  const gen=document.querySelector('input[name="sgen"]:checked')?.value||'ذكر';
  if(name.length<3){ toast('✍️ أدخل الاسم الكامل للتلميذ(ة)','warn'); return; }
  if(state.students.some(s=>s.level===app.lv && s.name.trim()===name)){ toast('⚠️ الاسم موجود مسبقا في هذا المستوى','warn'); return; }
  upsert('students',{id:uid(), name, gender:gen, level:app.lv, createdAt:new Date().toISOString()});
  toast('✔ أُضيف التلميذ(ة) إلى '+levelName(app.lv));
  setTimeout(()=>{ const el=$('sName'); if(el){ el.value=''; el.focus(); } },120);
};
Q.delStudent=async sid=>{
  const s=studentOf(sid); if(!s) return;
  state.events.filter(e=>e.studentId===sid).forEach(e=>removeDoc('events',e.id));
  ['weeklyTests','ccTests'].forEach(col=>state[col].forEach(t=>{ if(t.grades && sid in t.grades){ const g={...t.grades}; delete g[sid]; upsert(col,{...t, grades:g}); } }));
  await removeDoc('students',sid);
  if(app.sid===sid){ app.view = app.mode==='admin'?'admin':'vpick'; }
  render(); toast('🗑 حُذف التلميذ(ة) '+esc(s.name));
};

Q.addTest=kind=>{
  const subject=$('tSubj').value;
  const date=$('tDate').value;
  const title=($('tTitle').value||'').trim() || (kind==='weekly'?('اختبار '+subjOf(subject).name):('مراقبة '+subjOf(subject).name));
  if(!date){ toast('📅 حدد تاريخ الاختبار','warn'); return; }
  upsert(COLK[kind],{id:uid(), level:app.lv, subject, date, title, grades:{}, createdAt:new Date().toISOString()});
  toast('✔ بُرمج الاختبار في '+levelName(app.lv));
  if(kind==='weekly' && date>=todayISO()) setTimeout(()=>toast('📢 سيظهر تلقائيا في ركن إعلان هام'),700);
};
Q.delTest=(kind,id)=>{ removeDoc(COLK[kind],id); toast('🗑 حُذف الاختبار ونقطه'); };
Q.openGrades=(kind,id)=>{
  const t=state[COLK[kind]].find(x=>x.id===id); if(!t) return;
  const sj=subjOf(t.subject);
  const studs=state.students.filter(s=>s.level===t.level).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  openModal(`
    <div class="modal-h"><span class="subj-tag" style="--sc:${sj.color}">${sj.icon} ${sj.name}</span> <span class="hl">${esc(t.title)}</span></div>
    <p class="mini muted">📅 ${fmtDate(t.date)} · ${levelName(t.level)} — أدخل النقطة مباشرة (من 0 إلى 10)، اترك الخانة فارغة للإلغاء.</p>
    <div style="margin-top:10px">
      ${studs.length?studs.map(s=>`<div class="g-row"><span>${esc(s.name)}</span><input class="input g-in" data-sid="${s.id}" type="number" min="0" max="10" step="0.25" inputmode="decimal" placeholder="النقطة" value="${t.grades?.[s.id]??''}"></div>`).join(''):empty('🪑','لا تلاميذ في هذا المستوى.')}
    </div>
    <div class="modal-actions"><button class="btn btn-red" onclick="Q.saveGrades('${kind}','${id}')">💾 حفظ النقاط</button><button class="btn btn-ghost" onclick="Q.closeModal()">إلغاء</button></div>`);
  setTimeout(()=>document.querySelector('.g-in')?.focus(),80);
};
Q.saveGrades=(kind,id)=>{
  const t=state[COLK[kind]].find(x=>x.id===id); if(!t) return;
  const grades={...(t.grades||{})}; let bad=false;
  document.querySelectorAll('.g-in').forEach(inp=>{
    const sid=inp.dataset.sid, raw=(inp.value??'').trim();
    if(raw===''){ delete grades[sid]; inp.classList.remove('err'); return; }
    const v=parseFloat(raw);
    if(isNaN(v)||v<0||v>10){ inp.classList.add('err'); bad=true; }
    else{ inp.classList.remove('err'); grades[sid]=Math.round(v*100)/100; }
  });
  if(bad){ toast('⛔ نقطة غير صالحة — يجب أن تكون بين 0 و 10','warn'); return; }
  upsert(COLK[kind],{...t, grades});
  Q.closeModal(); toast('✔ حُفظت النقاط وحُدِّثت المعدلات تلقائيا');
};

Q.addAnn=()=>{
  const text=($('annText').value||'').trim();
  if(!text){ toast('✍️ اكتب نص الإعلان','warn'); return; }
  upsert('announcements',{id:uid(), text, level:$('annLv').value, date:$('annDate').value||todayISO()});
  toast('📢 نُشر الإعلان');
};
Q.delAnn=id=>{ removeDoc('announcements',id); toast('🗑 حُذف الإعلان'); };

Q.addEvent=sid=>{
  const type=$('evType').value;
  const note=($('evNote').value||'').trim();
  upsert('events',{id:uid(), studentId:sid, type, date:todayISO(), note, restored:false});
  const c=EVENT_TYPES[type];
  toast(`${c.icon} سُجل: ${c.label} — طُبقت الآثار تلقائيا`);
};
Q.justify=eid=>{
  const e=state.events.find(x=>x.id===eid); if(!e) return;
  if(!within3(e.date)){ toast('⛔ انتهت مهلة التبرير (3 أيام)','warn'); return; }
  upsert('events',{...e, restored:true, justifiedAt:todayISO()});
  toast('✔ بُرر الغياب واسترجع التلميذ(ة) +0.30');
};
Q.delEvent=eid=>{ removeDoc('events',eid); toast('🗑 حُذف الحدث وأُلغي أثره'); };
Q.doRefresh=()=>{ runMonthlyRefresh(true); };

/* ---------- boot ---------- */
function buildDoodles(){
  const dood=$('doodles');
  const chars=['÷','×','√','+','=','أ','ب','★','✎','؟','%','∑'];
  for(let i=0;i<16;i++){
    const s=document.createElement('span');
    s.textContent=chars[i%chars.length];
    s.style.right=(Math.random()*94)+'%'; s.style.top=(Math.random()*92)+'%';
    s.style.fontSize=(22+Math.random()*46)+'px';
    s.style.animationDuration=(9+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*10)+'s';
    dood.appendChild(s);
  }
}
loadLocal();
buildDoodles();
render();
bootApp();
window.addEventListener('online', ()=>{ setConn('online'); checkConnection(); });
window.addEventListener('offline', ()=>setConn('offline'));
setInterval(()=>{ tickClock(); updateCountdowns(); if(Date.now()>=nextTarget.getTime()) checkAutoRefresh(); },1000);
setInterval(checkConnection, 8000);
setTimeout(()=>{ if(!autoChecked){ autoChecked=true; checkAutoRefresh(); } }, 4000);
</script>
