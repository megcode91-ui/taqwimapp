<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadbir | تدبير - منظومة التدبير الشامل</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#0A2540', accent: '#0066FF', success: '#00C853', warning: '#FF6D00', danger: '#D50000', bg: '#F8FAFC' },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], inter: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        :root { --glass-bg: rgba(255, 255, 255, 0.85); --glass-border: rgba(255, 255, 255, 0.6); --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); }
        .dark { --glass-bg: rgba(15, 23, 42, 0.85); --glass-border: rgba(255, 255, 255, 0.1); --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; transition: background-color 0.3s ease; }
        .dark body { background-color: #0f172a; color: #e2e8f0; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 16px; }
        .glass-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.15); }
        .rank-1 { background: linear-gradient(135deg, #FFD700 0%, #FDB931 100%); color: #000; font-weight: 800; }
        .rank-2 { background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%); color: #000; font-weight: 700; }
        .rank-3 { background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%); color: #fff; font-weight: 700; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item.active { background-color: rgba(0, 102, 255, 0.1); color: #0066FF; border-right: 3px solid #0066FF; }
        .dark .nav-item.active { background-color: rgba(0, 102, 255, 0.2); }
        /* Loading Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0066FF; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 antialiased">

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-primary to-slate-900 p-4">
        <div class="glass w-full max-w-md p-8 text-center fade-in">
            <div class="mb-6">
                <i class="fas fa-graduation-cap text-5xl text-accent mb-4"></i>
                <h1 class="text-3xl font-bold text-primary dark:text-white">Tadbir | تدبير</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2">منظومة التدبير الشامل للتعلم</p>
                <p class="text-sm text-slate-400 mt-1">إشراف: الأستاذ محمد الغمري</p>
            </div>

            <div id="teacherLoginForm" class="space-y-4">
                <h3 class="text-lg font-semibold text-primary dark:text-accent">دخول الأستاذ (الإدارة)</h3>
                <input type="email" id="teacherEmail" placeholder="البريد الإلكتروني" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent" value="meg.code91@gmail.com">
                <input type="password" id="teacherPassword" placeholder="كلمة المرور" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent">
                <button id="btnLoginTeacher" class="w-full bg-accent hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300 flex justify-center items-center gap-2">
                    <span>دخول</span> <i class="fas fa-sign-in-alt"></i>
                </button>
            </div>

            <div class="my-6 flex items-center"><div class="flex-grow border-t border-slate-300 dark:border-slate-600"></div><span class="mx-4 text-slate-400 text-sm">أو</span><div class="flex-grow border-t border-slate-300 dark:border-slate-600"></div></div>

            <div id="visitorLoginForm" class="space-y-4">
                <h3 class="text-lg font-semibold text-primary dark:text-accent">دخول ولي الأمر (زائر)</h3>
                <input type="text" id="visitorName" placeholder="الاسم الكامل" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent">
                <button id="btnLoginVisitor" class="w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-3 rounded-lg transition duration-300 flex justify-center items-center gap-2">
                    <span>دخول كزائر</span> <i class="fas fa-eye"></i>
                </button>
            </div>
            <div id="loginError" class="mt-4 text-danger text-sm hidden font-bold"></div>
        </div>
    </div>

    <!-- Main App Layout -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-64 glass md:h-screen md:sticky md:top-0 flex flex-col z-40">
            <div class="p-6 border-b border-slate-200 dark:border-slate-700">
                <h2 class="text-2xl font-bold text-primary dark:text-white flex items-center gap-2"><i class="fas fa-layer-group text-accent"></i> تدبير</h2>
                <p id="userDisplay" class="text-xs text-slate-500 mt-1 truncate"></p>
            </div>
            <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-3" id="sidebarNav"></nav>
            <div class="p-4 border-t border-slate-200 dark:border-slate-700">
                <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition mb-2">
                    <i class="fas fa-moon text-slate-500"></i> <span>الوضع الليلي</span>
                </button>
                <button id="btnLogout" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-danger transition">
                    <i class="fas fa-sign-out-alt"></i> <span>تسجيل الخروج</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8 overflow-y-auto h-screen">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 id="pageTitle" class="text-2xl md:text-3xl font-bold text-primary dark:text-white">لوحة القيادة الذكية</h1>
                    <p class="text-slate-500 text-sm mt-1">نظرة شاملة على أداء القسم</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden md:block text-left">
                        <p class="text-sm font-semibold" id="currentDate"></p>
                    </div>
                </div>
            </header>
            <div id="contentArea" class="space-y-6 fade-in"></div>
        </main>
    </div>

    <!-- Universal Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass bg-white dark:bg-slate-900 w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-danger transition">
                <i class="fas fa-times text-xl"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Firebase & App Logic (ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDocs, writeBatch, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics.js";

        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDINWHZW3yo9a7Ch1fDFgGlePnD4dvovzs",
            authDomain: "taqwim-d363e.firebaseapp.com",
            projectId: "taqwim-d363e",
            storageBucket: "taqwim-d363e.firebasestorage.app",
            messagingSenderId: "996744665537",
            appId: "1:996744665537:web:018aee25726259f8507740",
            measurementId: "G-Q248VTXCG0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let analytics;
        try { analytics = getAnalytics(app); } catch(e) { console.log("Analytics not available in this environment"); }

        // 2. State Management
        const state = {
            user: null,
            role: null,
            visitorName: '',
            currentView: 'dashboard',
            students: [],
            tests: []
        };

        // Expose necessary functions to window for HTML onclick attributes
        window.navigateTo = navigateTo;
        window.closeModal = closeModal;
        window.toggleDarkMode = toggleDarkMode;
        window.logout = logout;
        window.filterStudents = filterStudents;
        window.deleteStudent = deleteStudent;
        window.viewStudentCard = viewStudentCard;
        window.openAddStudentModal = openAddStudentModal;
        window.saveNewStudent = saveNewStudent;
        window.saveAttendance = saveAttendance;

        // 3. Core Logic
        function isSummerVacation() {
            const now = new Date();
            const year = now.getFullYear();
            const start = new Date(year, 6, 1); // July 1
            const end = new Date(year, 8, 11);  // Sept 11
            return now >= start && now <= end;
        }

        function calculateStudentMetrics(student) {
            const testAvg = student.testAvg || 0;
            const caAvg = student.caAvg || 0;
            const activities = ((student.extraActivities || 0) + (student.distinctionActivities || 0)) * 0.01;
            const deductions = ((student.absences || 0) + (student.missedHomework || 0)) * 0.01;
            const cumulativeAvg = ((testAvg + caAvg) / 2) + activities - deductions;
            return {
                average: Math.max(0, cumulativeAvg).toFixed(2),
                isAtRisk: cumulativeAvg < 5,
                isExcellent: cumulativeAvg >= 8
            };
        }

        async function logAudit(action, details) {
            if (state.role !== 'teacher') return;
            try {
                await addDoc(collection(db, "auditLog"), {
                    action, details, user: state.user?.email || state.visitorName,
                    timestamp: serverTimestamp()
                });
            } catch (e) { console.error("Audit log failed", e); }
        }

        // 4. Authentication
        document.getElementById('btnLoginTeacher').addEventListener('click', async () => {
            const email = document.getElementById('teacherEmail').value;
            const password = document.getElementById('teacherPassword').value;
            const errorEl = document.getElementById('loginError');
            
            if (email !== "meg.code91@gmail.com") {
                errorEl.textContent = "البريد الإلكتروني غير مصرح به.";
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged will handle the rest
            } catch (error) {
                errorEl.textContent = "خطأ في الدخول: " + error.message;
                errorEl.classList.remove('hidden');
            }
        });

        document.getElementById('btnLoginVisitor').addEventListener('click', async () => {
            const name = document.getElementById('visitorName').value.trim();
            const errorEl = document.getElementById('loginError');
            
            if (!name) {
                errorEl.textContent = "الرجاء إدخال الاسم";
                errorEl.classList.remove('hidden');
                return;
            }

            if (isSummerVacation()) {
                alert("انتهى الموسم الدراسي - يمكنكم العودة في بداية الموسم المقبل");
                return;
            }

            state.visitorName = name;
            state.role = 'visitor';
            
            try {
                await addDoc(collection(db, "visitorLogs"), {
                    name: name, timestamp: serverTimestamp()
                });
            } catch(e) { console.log("Visitor log failed", e); }
            
            initApp();
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            signOut(auth);
            state.user = null; state.role = null; state.visitorName = '';
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        });

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "meg.code91@gmail.com") {
                state.user = user;
                state.role = 'teacher';
                initApp();
            }
        });

        // 5. UI Rendering
        function initApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
            
            document.getElementById('userDisplay').textContent = state.role === 'teacher' ? state.user.email : `زائر: ${state.visitorName}`;
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ar-MA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            renderSidebar();
            navigateTo('dashboard');
            setupRealtimeListeners();
        }

        function renderSidebar() {
            const navItems = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'لوحة القيادة', teacherOnly: false },
                { id: 'students', icon: 'fa-users', label: 'إدارة التلاميذ', teacherOnly: true },
                { id: 'assessment', icon: 'fa-calculator', label: 'محرك التقويم', teacherOnly: true },
                { id: 'attendance', icon: 'fa-clipboard-check', label: 'الحضور والسلوك', teacherOnly: true },
                { id: 'analytics', icon: 'fa-exclamation-triangle', label: 'الإنذار المبكر', teacherOnly: false },
                { id: 'motivation', icon: 'fa-trophy', label: 'نظام التحفيز', teacherOnly: false },
                { id: 'settings', icon: 'fa-cogs', label: 'مركز التحكم', teacherOnly: true }
            ];

            document.getElementById('sidebarNav').innerHTML = navItems.map(item => {
                if (item.teacherOnly && state.role !== 'teacher') return '';
                return `<button onclick="navigateTo('${item.id}')" id="nav-${item.id}" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition mb-1 text-sm font-semibold">
                    <i class="fas ${item.icon} w-5 text-center"></i> <span>${item.label}</span>
                </button>`;
            }).join('');
        }

        function navigateTo(viewId) {
            state.currentView = viewId;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${viewId}`);
            if (activeNav) activeNav.classList.add('active');

            const titles = { dashboard: 'لوحة القيادة الذكية', students: 'إدارة التلاميذ', assessment: 'محرك التقويم الذكي', attendance: 'الحضور والسلوك', analytics: 'التحليلات والإنذار المبكر', motivation: 'نظام التحفيز', settings: 'مركز التحكم' };
            document.getElementById('pageTitle').textContent = titles[viewId] || viewId;

            const content = document.getElementById('contentArea');
            content.innerHTML = '<div class="flex justify-center p-12"><div class="loader"></div></div>';
            
            setTimeout(() => {
                if (viewId === 'dashboard') renderDashboard(content);
                else if (viewId === 'students') renderStudents(content);
                else if (viewId === 'assessment') renderAssessment(content);
                else if (viewId === 'attendance') renderAttendance(content);
                else if (viewId === 'analytics') renderAnalytics(content);
                else if (viewId === 'motivation') renderMotivation(content);
                else if (viewId === 'settings') renderSettings(content);
            }, 200);
        }

        // --- VIEW RENDERERS ---
        function renderDashboard(container) {
            const metrics = state.students.map(s => calculateStudentMetrics(s));
            const atRiskCount = metrics.filter(m => m.isAtRisk).length;
            const avgClass = metrics.length > 0 ? (metrics.reduce((sum, m) => sum + parseFloat(m.average), 0) / metrics.length).toFixed(2) : 0;

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    ${statCard('إجمالي التلاميذ', state.students.length, 'fa-users', 'bg-blue-100 text-blue-600')}
                    ${statCard('متوسط القسم', avgClass, 'fa-chart-line', 'bg-green-100 text-green-600')}
                    ${statCard('تلاميذ في خطر', atRiskCount, 'fa-exclamation-circle', 'bg-red-100 text-red-600')}
                    ${statCard('الاختبارات المنجزة', state.tests.length, 'fa-file-alt', 'bg-purple-100 text-purple-600')}
                </div>
                <div class="glass p-6">
                    <h3 class="font-bold text-lg mb-4">توزيع المعدلات</h3>
                    <canvas id="gradesChart" height="100"></canvas>
                </div>
            `;

            setTimeout(() => {
                new Chart(document.getElementById('gradesChart'), {
                    type: 'bar',
                    data: {
                        labels: ['< 5', '5 - 6', '6 - 7', '7 - 8', '> 8'],
                        datasets: [{
                            label: 'عدد التلاميذ',
                            data: [
                                metrics.filter(m => m.average < 5).length,
                                metrics.filter(m => m.average >= 5 && m.average < 6).length,
                                metrics.filter(m => m.average >= 6 && m.average < 7).length,
                                metrics.filter(m => m.average >= 7 && m.average < 8).length,
                                metrics.filter(m => m.average >= 8).length
                            ],
                            backgroundColor: ['#D50000', '#FF6D00', '#FFD600', '#00C853', '#0066FF'],
                            borderRadius: 6
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }, 100);
        }

        function statCard(title, value, icon, colorClass) {
            return `<div class="glass glass-card p-4 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full ${colorClass} flex items-center justify-center text-xl"><i class="fas ${icon}"></i></div>
                <div><p class="text-slate-500 text-xs font-semibold">${title}</p><p class="text-2xl font-bold font-inter text-primary dark:text-white">${value}</p></div>
            </div>`;
        }

        function renderStudents(container) {
            const sortedStudents = [...state.students].sort((a, b) => calculateStudentMetrics(b).average - calculateStudentMetrics(a).average);
            container.innerHTML = `
                <div class="glass p-4 mb-4 flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div class="relative w-full md:w-96">
                        <i class="fas fa-search absolute right-3 top-3 text-slate-400"></i>
                        <input type="text" id="studentSearch" onkeyup="filterStudents()" placeholder="بحث بالاسم..." class="w-full pr-10 pl-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 focus:outline-none focus:ring-2 focus:ring-accent">
                    </div>
                    <button onclick="openAddStudentModal()" class="bg-accent text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2">
                        <i class="fas fa-plus"></i> إضافة تلميذ
                    </button>
                </div>
                <div class="glass overflow-x-auto">
                    <table class="w-full text-sm text-right">
                        <thead class="bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold">
                            <tr>
                                <th class="p-4 rounded-tr-lg">الرتبة</th><th class="p-4">الاسم الكامل</th><th class="p-4">المستوى</th>
                                <th class="p-4 font-inter">المعدل</th><th class="p-4 rounded-tl-lg text-center">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                            ${sortedStudents.map((s, index) => {
                                const metrics = calculateStudentMetrics(s);
                                const rank = index + 1;
                                let rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
                                return `<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition student-row" data-name="${s.name}">
                                    <td class="p-4 font-bold ${rankClass} w-16 text-center rounded-r-lg">${rank}</td>
                                    <td class="p-4 font-semibold">${s.name}</td>
                                    <td class="p-4"><span class="px-2 py-1 rounded-full text-xs bg-slate-200 dark:bg-slate-700">${s.level}</span></td>
                                    <td class="p-4 font-inter font-bold ${metrics.isAtRisk ? 'text-danger' : (metrics.isExcellent ? 'text-success' : 'text-primary')}">${metrics.average}</td>
                                    <td class="p-4 text-center">
                                        <button onclick="viewStudentCard('${s.id}')" class="text-accent hover:text-blue-700 mx-1" title="عرض"><i class="fas fa-eye"></i></button>
                                        <button onclick="deleteStudent('${s.id}')" class="text-danger hover:text-red-700 mx-1" title="حذف"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // --- ACTION FUNCTIONS (FIXED & WORKING) ---
        window.filterStudents = function() {
            const query = document.getElementById('studentSearch').value.toLowerCase();
            document.querySelectorAll('.student-row').forEach(row => {
                row.style.display = row.getAttribute('data-name').toLowerCase().includes(query) ? '' : 'none';
            });
        };

        window.openAddStudentModal = function() {
            document.getElementById('modalContent').innerHTML = `
                <h3 class="text-xl font-bold mb-4 text-primary dark:text-white">إضافة تلميذ جديد</h3>
                <form id="addStudentForm" class="space-y-4">
                    <div><label class="block text-sm font-semibold mb-1">الاسم الكامل</label>
                        <input type="text" id="newStudentName" required class="w-full px-4 py-2 rounded-lg border dark:bg-slate-800 dark:border-slate-600 focus:ring-2 focus:ring-accent outline-none">
                    </div>
                    <div><label class="block text-sm font-semibold mb-1">المستوى</label>
                        <select id="newStudentLevel" class="w-full px-4 py-2 rounded-lg border dark:bg-slate-800 dark:border-slate-600 focus:ring-2 focus:ring-accent outline-none">
                            <option value="الخامس ابتدائي">الخامس ابتدائي</option>
                            <option value="السادس ابتدائي">السادس ابتدائي</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-semibold mb-1">معدل الاختبارات</label>
                            <input type="number" step="0.01" id="newStudentTestAvg" value="0" class="w-full px-4 py-2 rounded-lg border dark:bg-slate-800 dark:border-slate-600">
                        </div>
                        <div><label class="block text-sm font-semibold mb-1">معدل المراقبة</label>
                            <input type="number" step="0.01" id="newStudentCaAvg" value="0" class="w-full px-4 py-2 rounded-lg border dark:bg-slate-800 dark:border-slate-600">
                        </div>
                    </div>
                    <button type="button" onclick="saveNewStudent()" class="w-full bg-accent text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition mt-4">حفظ التلميذ</button>
                </form>
            `;
            document.getElementById('modalOverlay').classList.remove('hidden');
        };

        window.saveNewStudent = async function() {
            const name = document.getElementById('newStudentName').value;
            const level = document.getElementById('newStudentLevel').value;
            const testAvg = parseFloat(document.getElementById('newStudentTestAvg').value) || 0;
            const caAvg = parseFloat(document.getElementById('newStudentCaAvg').value) || 0;

            if (!name) { alert("الرجاء إدخال الاسم"); return; }

            try {
                await addDoc(collection(db, "students"), {
                    name, level, testAvg, caAvg, extraActivities: 0, distinctionActivities: 0, absences: 0, missedHomework: 0,
                    createdAt: serverTimestamp()
                });
                closeModal();
                alert("تم إضافة التلميذ بنجاح!");
                logAudit("إضافة تلميذ", name);
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء الحفظ. تأكد من صلاحيات Firestore.");
            }
        };

        window.deleteStudent = async function(id) {
            const code = prompt("أدخل رمز الحذف للتأكيد (081191):");
            if (code === "081191") {
                if(confirm("هل أنت متأكد من حذف هذا التلميذ نهائياً؟")) {
                    try {
                        await deleteDoc(doc(db, "students", id));
                        alert("تم الحذف بنجاح");
                        logAudit("حذف تلميذ", id);
                    } catch (error) {
                        alert("خطأ في الحذف: " + error.message);
                    }
                }
            } else if (code !== null) {
                alert("رمز الحذف غير صحيح");
            }
        };

        window.viewStudentCard = function(id) {
            const student = state.students.find(s => s.id === id);
            if (!student) return;
            const metrics = calculateStudentMetrics(student);
            
            document.getElementById('modalContent').innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-accent/10 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl text-accent">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-primary dark:text-white">${student.name}</h3>
                    <p class="text-slate-500">${student.level}</p>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg text-center">
                        <p class="text-xs text-slate-500">المعدل التراكمي</p>
                        <p class="text-2xl font-bold font-inter ${metrics.isAtRisk ? 'text-danger' : 'text-success'}">${metrics.average}</p>
                    </div>
                    <div class="p-3 bg-slate-50 dark:bg-slate-800 rounded-lg text-center">
                        <p class="text-xs text-slate-500">حالة الأداء</p>
                        <p class="text-lg font-bold ${metrics.isExcellent ? 'text-success' : (metrics.isAtRisk ? 'text-danger' : 'text-warning')}">
                            ${metrics.isExcellent ? 'ممتاز' : (metrics.isAtRisk ? 'في خطر' : 'جيد')}
                        </p>
                    </div>
                </div>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between p-2 border-b dark:border-slate-700"><span>الغياب</span> <span class="font-inter text-danger">-${(student.absences || 0) * 0.01}</span></div>
                    <div class="flex justify-between p-2 border-b dark:border-slate-700"><span>الواجبات غير المنجزة</span> <span class="font-inter text-danger">-${(student.missedHomework || 0) * 0.01}</span></div>
                    <div class="flex justify-between p-2"><span>الأنشطة الإضافية</span> <span class="font-inter text-success">+${((student.extraActivities || 0) + (student.distinctionActivities || 0)) * 0.01}</span></div>
                </div>
            `;
            document.getElementById('modalOverlay').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('modalOverlay').classList.add('hidden');
        };

        window.saveAttendance = async function() {
            const date = document.getElementById('attendanceDate').value;
            const absences = document.querySelectorAll('input[data-type="absence"]:checked');
            const homeworks = document.querySelectorAll('input[data-type="homework"]:checked');
            
            if (!date) { alert("الرجاء اختيار التاريخ"); return; }

            const batch = writeBatch(db);
            let count = 0;
            
            absences.forEach(cb => {
                const ref = doc(collection(db, "attendance"));
                batch.set(ref, { studentId: cb.dataset.id, date, unexcusedAbsence: true, missedHomework: false, timestamp: serverTimestamp() });
                count++;
            });

            homeworks.forEach(cb => {
                const ref = doc(collection(db, "attendance"));
                batch.set(ref, { studentId: cb.dataset.id, date, unexcusedAbsence: false, missedHomework: true, timestamp: serverTimestamp() });
                count++;
            });

            if (count === 0) { alert("لم يتم تحديد أي تسجيلات"); return; }

            try {
                await batch.commit();
                alert(`تم حفظ ${count} تسجيلات بنجاح`);
                logAudit("تسجيل حضور وغياب", date);
                // Reset checkboxes
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            } catch (error) {
                alert("خطأ في الحفظ: " + error.message);
            }
        };

        function renderAttendance(container) {
            container.innerHTML = `
                <div class="glass p-6">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h3 class="font-bold text-lg">تسجيل الحضور والسلوك</h3>
                        <input type="date" id="attendanceDate" class="p-2 rounded border dark:bg-slate-800 dark:border-slate-600" value="${new Date().toISOString().split('T')[0]}">
                    </div>
                    <div class="overflow-x-auto max-h-[60vh]">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-50 dark:bg-slate-800 sticky top-0">
                                <tr>
                                    <th class="p-3 text-right">التلميذ</th>
                                    <th class="p-3 text-center">غياب غير مبرر<br><span class="text-xs text-danger">(-0.01)</span></th>
                                    <th class="p-3 text-center">عدم إنجاز الواجب<br><span class="text-xs text-danger">(-0.01)</span></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                                ${state.students.map(s => `
                                    <tr>
                                        <td class="p-3 font-semibold">${s.name}</td>
                                        <td class="p-3 text-center"><input type="checkbox" class="w-5 h-5 text-danger rounded focus:ring-danger" data-id="${s.id}" data-type="absence"></td>
                                        <td class="p-3 text-center"><input type="checkbox" class="w-5 h-5 text-warning rounded focus:ring-warning" data-id="${s.id}" data-type="homework"></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <button onclick="saveAttendance()" class="mt-6 w-full bg-primary text-white py-3 rounded-lg hover:bg-slate-800 transition font-bold">حفظ التسجيلات</button>
                </div>
            `;
        }

        function renderAssessment(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass p-6">
                        <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i class="fas fa-file-signature text-accent"></i> الاختبارات الأسبوعية</h3>
                        <div class="space-y-4">
                            <select class="w-full p-2 rounded border dark:bg-slate-800 dark:border-slate-600"><option>الرياضيات</option><option>اللغة الفرنسية</option><option>النشاط العلمي</option></select>
                            <select class="w-full p-2 rounded border dark:bg-slate-800 dark:border-slate-600"><option>الخامس ابتدائي</option><option>السادس ابتدائي</option></select>
                            <input type="date" class="w-full p-2 rounded border dark:bg-slate-800 dark:border-slate-600">
                            <button onclick="alert('سيتم فتح جدول إدخال النقط لجميع التلاميذ')" class="w-full bg-accent text-white py-2 rounded hover:bg-blue-700 transition">بدء إدخال النقط</button>
                        </div>
                    </div>
                    <div class="glass p-6">
                        <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i class="fas fa-tasks text-purple-500"></i> المراقبة المستمرة (CA)</h3>
                        <p class="text-sm text-slate-500 mb-4">5 مراحل × 3 مواد (فرنسية، رياضيات، نشاط علمي)</p>
                        <button onclick="alert('سيتم فتح واجهة تحديث المراقبة المستمرة')" class="w-full border-2 border-dashed border-slate-300 dark:border-slate-600 text-slate-500 py-4 rounded-lg hover:border-accent hover:text-accent transition">
                            <i class="fas fa-plus-circle text-2xl mb-2 block"></i> تحديث نقاط المراقبة المستمرة
                        </button>
                    </div>
                </div>
            `;
        }

        function renderAnalytics(container) {
            const atRiskStudents = state.students.filter(s => calculateStudentMetrics(s).isAtRisk);
            container.innerHTML = `
                <div class="glass p-6">
                    <h3 class="font-bold text-lg mb-4 text-danger">جدول التلاميذ في خطر والتوصيات</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-red-50 dark:bg-red-900/20 text-danger">
                                <tr><th class="p-3 text-right">التلميذ</th><th class="p-3 text-center">المعدل</th><th class="p-3 text-right">مستوى الخطر</th><th class="p-3 text-right">التوصية</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                                ${atRiskStudents.map(s => {
                                    const avg = parseFloat(calculateStudentMetrics(s).average);
                                    let level = 'منخفض', rec = 'تشجيع وتحفيز', color = 'text-warning';
                                    if (avg < 5) { level = 'عالي'; rec = 'تدخل فوري + حصص دعم'; color = 'text-danger font-bold'; }
                                    else if (avg < 6) { level = 'متوسط'; rec = 'متابعة أسبوعية'; color = 'text-warning font-bold'; }
                                    return `<tr>
                                        <td class="p-3 font-semibold">${s.name}</td>
                                        <td class="p-3 text-center font-inter font-bold text-danger">${avg}</td>
                                        <td class="p-3 ${color}">${level}</td>
                                        <td class="p-3 text-slate-600 dark:text-slate-300">${rec}</td>
                                    </tr>`;
                                }).join('')}
                                ${atRiskStudents.length === 0 ? '<tr><td colspan="4" class="p-4 text-center text-slate-500">لا يوجد تلاميذ في خطر حالياً</td></tr>' : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderMotivation(container) {
            const sorted = [...state.students].sort((a, b) => calculateStudentMetrics(b).average - calculateStudentMetrics(a).average).slice(0, 6);
            container.innerHTML = `
                <div class="glass p-6">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i class="fas fa-crown text-yellow-500"></i> لوحة المتصدرين</h3>
                    <div class="space-y-3">
                        ${sorted.map((s, i) => {
                            const medals = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣', '6️⃣'];
                            return `<div class="flex items-center gap-4 p-3 bg-white/50 dark:bg-slate-800/50 rounded-lg border border-slate-100 dark:border-slate-700">
                                <span class="text-2xl">${medals[i]}</span>
                                <div class="flex-1"><h4 class="font-bold text-primary dark:text-white">${s.name}</h4><p class="text-xs text-slate-500">${s.level}</p></div>
                                <div class="text-left"><span class="font-inter font-bold text-accent text-lg">${calculateStudentMetrics(s).average}</span><span class="text-xs text-slate-400 block">معدل</span></div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderSettings(container) {
            container.innerHTML = `
                <div class="glass p-6 max-w-2xl">
                    <h3 class="font-bold text-lg mb-6">مركز التحكم والإعدادات</h3>
                    <div class="space-y-6">
                        <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800 rounded-lg">
                            <div><h4 class="font-semibold">الوضع الليلي</h4><p class="text-xs text-slate-500">تفعيل المظهر الداكن للتطبيق</p></div>
                            <button onclick="toggleDarkMode()" class="w-12 h-6 bg-slate-300 dark:bg-accent rounded-full relative transition-colors">
                                <div class="w-4 h-4 bg-white rounded-full absolute top-1 right-1 dark:left-1 dark:right-auto transition-all"></div>
                            </button>
                        </div>
                        <div class="border-t border-slate-200 dark:border-slate-700 pt-6">
                            <h4 class="font-semibold mb-4">إدارة البيانات</h4>
                            <button onclick="alert('ميزة التصدير قيد التطوير')" class="w-full bg-primary text-white py-2 rounded-lg hover:bg-slate-800 transition mb-2">
                                <i class="fas fa-download ml-2"></i> تصدير البيانات (JSON)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 6. Utilities
        window.toggleDarkMode = function() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            if (state.currentView === 'settings') navigateTo('settings');
        };

        function setupRealtimeListeners() {
            onSnapshot(collection(db, "students"), (snapshot) => {
                state.students = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (['dashboard', 'students', 'motivation', 'analytics'].includes(state.currentView)) {
                    navigateTo(state.currentView);
                }
            });

            onSnapshot(collection(db, "tests"), (snapshot) => {
                state.tests = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (state.currentView === 'dashboard') navigateTo('dashboard');
            });
        }
    </script>
</body>
</html>
