urn `<div class="up-row"><span class="subj-tag" style="--sc:${sj.color}">${sj.icon} ${sj.name}</span><span style="flex:1">${esc(t.title)}</span><span class="up-in">${du===0?'اليوم':'بعد '+du+' يوم'}</span></div>`;}).join(''):empty('🔕','لا اختبارات مبرمجة مستقبليا.')} </div> </div> <div class="card reveal" style="margin-top:14px"> <h3 class="card-h">⚖️ ${isAdmin?'التحفيز والعقوبات — تسجيل حدث':'سجل التلميذ(ة)'}</h3> ${isAdmin?` <div class="ev-form"> <select id="evType" class="input" style="max-width:270px">${Object.entries(EVENT_TYPES).filter(([k])=>k!=='rankDrop').map(([k,c])=>`<option value="${k}">${c.icon} ${c.label}</option>`).join('')}</select> <input id="evNote" class="input" placeholder="ملاحظة (اختياري)"> <button class="btn btn-red" onclick="Q.addEvent('${s.id}')">تسجيل ✔</button> </div> <p class="mini muted" style="margin-bottom:12px">تُطبَّق الآثار على المعدلات تلقائيا فور التسجيل · 🚷🌪️📉 أحداث سرية لا تظهر للزوار · التبرير متاح خلال 3 أيام.</p>`:''} ${eventRows(s.id, isAdmin)} </div> </div>`; } /* ---------- render ---------- */ function render(){ const root=document.getElementById('app'); if(app.view==='gate') root.innerHTML=viewGate(); else if(app.view==='vpick') root.innerHTML=viewVisitorPick(); else if(app.view==='admin') root.innerHTML=viewAdmin(); else if(app.view==='student') root.innerHTML=viewStudent(); afterRender(); } const io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }),{threshold:.07}); function afterRender(){ document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el)); document.querySelectorAll('[data-to]').forEach(el=>{ const to=parseFloat(el.dataset.to)||0, dec=+(el.dataset.dec||0), t0=performance.now(), dur=750; (function step(t){ const p=Math.min(1,(t-t0)/dur); el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(dec); if(p<1) requestAnimationFrame(step); })(t0); }); tickClock(); updateCountdowns(); } function tickClock(){ const n=new Date(); const s= mentById('loginCard').classList.add('shake'); setTimeout(()=>{el.classList.remove('err'); document.getElementById('loginCard')?.classList.remove('shake');},600); toast('⛔ هذا البريد غير مصرّح له بالدخول كأستاذ','warn'); } }; Q.logout=()=>{ localStorage.removeItem('qismi_admin'); app.view='gate'; app.loginOpen=false; render(); toast('تم تسجيل الخروج — إلى اللقاء 👋'); }; Q.toGate=()=>{ app.view='gate'; render(); window.scrollTo(0,0); }; Q.toVisitorPick=(lv)=>{ app.view='vpick'; app.vlv=lv||null; render(); window.scrollTo(0,0); }; Q.openStudent=(sid,mode)=>{ app.sid=sid; app.mode=mode; if(mode==='visitor' && !app.vlv) app.vlv=studentOf(sid)?.level; app.view='student'; render(); window.scrollTo(0,0); }; Q.toAdmin=tab=>{ app.view='admin'; app.tab=tab; render(); window.scrollTo(0,0); }; Q.setLv=lv=>{ app.lv=lv; render(); }; Q.filterStudents=q=>{ q=(q||'').trim(); document.querySelectorAll('.stu-row[data-q]').forEach(r=>{ r.style.display = (!q || r.dataset.q.includes(q)) ? '' : 'none'; }); }; Q.addStudent=()=>{ const name=(document.getElementById('sName').value||'').trim(); const gen=document.querySelector('input[name="sgen"]:checked')?.value||'ذكر'; if(name.length<3){ toast('✍️ أدخل الاسم الكامل للتلميذ(ة)','warn'); return; } if(state.students.some(s=>s.level===app.lv && s.name.trim()===name)){ toast('⚠️ الاسم موجود مسبقا في هذا المستوى','warn'); return; } upsert('students',{id:uid(), name, gender:gen, level:app.lv, createdAt:new Date().toISOString()}); toast('✔ أُضيف التلميذ(ة) إلى '+levelName(app.lv)); setTimeout(()=>{ const el=document.getElementById('sName'); if(el){ el.value=''; el.focus(); } },120); }; Q.delStudent=async sid=>{ const s=studentOf(sid); if(!s) return; state.events.filter(e=>e.studentId===sid).forEach(e=>removeDoc('events',e.id)); ['weeklyTests','ccTests'].forEach(col=>state[col].forEach(t=>{ if(t.grades && sid in t.grades){ const g={...t.grades}; delete g[sid]; upsert(col,{...t, grades:g}); } })); await removeDoc('students',sid); if(app.sid===sid){ app.view = app.mode==='admin'?'admin':'vpick'; } render(); toast('🗑 حُذف التلميذ(ة) '+esc(s.name)); }; Q.addTest=kind=>{ const subject=document.getElementById('tSubj').value; const date=document.getElementById('tDate').value; const title=(document.getElementById('tTitle').value||'').trim() || (kind==='weekly'?('اختبار '+subjOf(subject).name):('مراقبة '+subjOf(subject).name)); if(!date){ toast('📅 حدد تاريخ الاختبار','warn'); return; } upsert(COLK[kind],{id:uid(), level:app.lv, subject, date, title, grades:{}, createdAt:new Date().toISOString()}); toast('✔ بُرمج الاختبار في '+levelName(app.lv)); if(kind==='weekly' && date>=todayISO()) setTimeout(()=>toast('📢 سيظهر تلقائيا في ركن إعلان هام'),700); }; Q.delTest=(kind,id)=>{ removeDoc(COLK[kind],id); toast('🗑 حُذف الاختبار ونقطه'); }; Q.openGrades=(kind,id)=>{ const t=state[COLK[kind]].find(x=>x.id===id); if(!t) return; const sj=subjOf(t.subject); const studs=state.students.filter(s=>s.level===t.level).sort((a,b)=>a.name.localeCompare(b.name,'ar')); openModal(` <div class="modal-h"><span class="subj-tag" style="--sc:${sj.color}">${sj.icon} ${sj.name}</span> <span class="hl">${esc(t.title)}</span></div> <p class="mini muted">📅 ${fmtDate(t.date)} · ${levelName(t.level)} — أدخل النقطة مباشرة (من 0 إلى 10)، اترك الخانة فارغة للإلغاء.</p> <div style="margin-top:10px"> ${studs.length?studs.map(s=>`<div class="g-row"><span>${esc(s.name)}</span><input class="input g-in" data-sid="${s.id}" type="number" min="0" max="10" step="0.25" inputmode="decimal" placeholder="النقطة" value="${t.grades?.[s.id]??''}"></div>`).join(''):empty('🪑','لا تلاميذ في هذا المستوى.')} </div> <div class="modal-actions"><button class="btn btn-red" onclick="Q.saveGrades('${kind}','${id}')">💾 حفظ النقاط</button><button class="btn btn-ghost" onclick="Q.closeModal()">إلغاء</button></div>`); setTimeout(()=>document.querySelector('.g-in')?.focus(),80); }; Q.saveGrades=(kind,id)=>{ const t=state[COLK[kind]].find(x=>x.id===id); if(!t) return; const grades={...(t.gra ntSize=(22+Math.random()*46)+'px'; s.style.animationDuration=(9+Math.random()*14)+'s'; s.style.animationDelay=(-Math.random()*10)+'s'; dood.appendChild(s); } } loadLocal(); buildDoodles(); render(); initFirebase(); setTimeout(()=>{ if(!autoChecked){ autoChecked=true; checkAutoRefresh(); } }, 3500); setInterval(()=>{ tickClock(); updateCountdowns(); if(Date.now()>=nextTarget.getTime()) checkAutoRefresh(); },1000); </script> </body> </html>
